name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_ignore_scripts: false

      - name: Validate content (PRD §33)
        run: npm run content:check

      - name: Build site
        run: npm run build

      - name: Build search index
        run: npm run search:build

      - name: Golden query regression (Top-3 ≥ 80%)
        run: npm run search:test
