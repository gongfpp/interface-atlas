name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Storage unit tests
        run: npm run test:unit

      - name: Type check (astro check)
        run: npm run check

      - name: Lint (react-hooks rules included)
        run: npm run lint

      - name: "Build (prebuild: content check + api layer + search index → astro build)"
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke test (search → concept → detail)
        run: npm run test:smoke

      - name: Golden query regression (Top-3 ≥ 80%)
        run: npm run search:test
