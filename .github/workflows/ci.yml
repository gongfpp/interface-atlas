name: 私有 WebKit 恢复诊断

on:
  push:
    branches: [dot/atlas-private-browser-qa]

permissions:
  contents: read

concurrency:
  group: atlas-private-browser-qa
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'push' && github.repository == 'gongfpp/interface-atlas' && github.event.repository.private == true && github.ref == 'refs/heads/dot/atlas-private-browser-qa' && false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLIC_LOG_API: 'off'
      PUBLIC_UMAMI_SRC: ''
      PUBLIC_UMAMI_ID: ''
      PUBLIC_CF_BEACON_TOKEN: ''
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 验证发布隔离与来源
        run: |
          node scripts/verify-private-qa.mjs
          mkdir -p qa-evidence
          git rev-parse HEAD > qa-evidence/commit.txt
          git rev-parse HEAD^{tree} > qa-evidence/tree.txt
          git cat-file -p HEAD | sed -n 's/^parent //p' > qa-evidence/parents.txt
          node --version > qa-evidence/node.txt
      - name: 安装锁定依赖
        run: npm ci
      - name: 全量单元测试
        run: npm run test:unit
      - name: 类型检查
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: 构建内容、API、搜索和站点
        run: npm run build
      - name: 搜索金标回归
        run: npm run search:test
      - name: 安装 Chromium
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch(); console.log(await browser.version()); await browser.close();' > qa-evidence/browser-version.txt
      - name: Tooltip 视口边缘与重测门禁
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: qa-evidence/viewport-results.json
        run: |
          npx playwright test --config=playwright.private-qa.config.mjs tests/tooltip-interaction.spec.mjs --grep '视口底边|基础提示|视口外的聚焦|初次离屏聚焦' --reporter=line,json --output=viewport-results
      - name: 计时与滚动边界重复回归（各五次）
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: qa-evidence/timing-repeat-results.json
        run: |
          npx playwright test --config=playwright.private-qa.config.mjs tests/button-feedback.spec.mjs tests/tooltip-interaction.spec.mjs --grep '焦点和悬停交错|en 1280px neumorphism' --repeat-each=5 --reporter=line,json --output=targeted-results
      - name: 真实浏览器、交互和截图
        run: npx playwright test --config=playwright.private-qa.config.mjs
      - name: 记录截图哈希与运行版本
        if: ${{ always() }}
        run: |
          mkdir -p qa-evidence
          if [ -x node_modules/.bin/playwright ]; then node_modules/.bin/playwright --version > qa-evidence/playwright-version.txt; fi
          for dir in test-results targeted-results viewport-results; do
            if [ -d "$dir" ]; then find "$dir" -type f -name '*.png' -print0; fi
          done | sort -z | xargs -0 -r sha256sum > qa-evidence/screenshots.sha256
      - name: 保存私有验收证据
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: atlas-private-qa-${{ github.sha }}
          path: |
            qa-evidence/
            test-results/
            targeted-results/
            viewport-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 7

  preload-diagnostic:
    if: ${{ github.event_name == 'push' && github.repository == 'gongfpp/interface-atlas' && github.event.repository.private == true && github.ref == 'refs/heads/dot/atlas-private-browser-qa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_LOG_API: 'off'
      PUBLIC_UMAMI_SRC: ''
      PUBLIC_UMAMI_ID: ''
      PUBLIC_CF_BEACON_TOKEN: ''
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 验证诊断隔离与来源
        run: |
          node scripts/verify-private-qa.mjs
          mkdir -p qa-evidence
          git rev-parse HEAD > qa-evidence/commit.txt
          git rev-parse HEAD^{tree} > qa-evidence/tree.txt
          git cat-file -p HEAD | sed -n 's/^parent //p' > qa-evidence/parents.txt
          git rev-parse HEAD:src > qa-evidence/src-tree.txt
          git rev-parse HEAD:astro.config.mjs > qa-evidence/default-config-blob.txt
          git rev-parse HEAD:package-lock.json > qa-evidence/lock-blob.txt
          test "$(cat qa-evidence/src-tree.txt)" = 733428b6f0b156269f434c31aa3bdd138a6b1164
          test "$(cat qa-evidence/default-config-blob.txt)" = 8a2e7733f781a6857134d3850bef5bfe8d24e435
          test "$(cat qa-evidence/lock-blob.txt)" = 57f0a9bf4efab97cc93c40e1536e1e2a15c09374
          node --version > qa-evidence/node.txt
          printf '%s\n' 'Diagnostic A/B only; baseline failures remain failures. No complete acceptance claimed.' > qa-evidence/scope.txt
      - name: 安装锁定依赖与官方 WebKit
        id: install
        run: |
          npm ci
          npx playwright install --with-deps webkit
          node --input-type=module -e 'import { webkit } from "playwright"; const browser = await webkit.launch(); console.log(await browser.version()); await browser.close();' > qa-evidence/browser-version.txt
      - name: 全量单元与配置边界
        run: npm run test:unit
      - name: 默认基线构建（不启用兼容插件）
        id: baseline_build
        run: |
          npm run build
          node scripts/record-preload-build.mjs baseline
      - name: 基线六项回归与冷加载采样
        id: baseline
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: qa-evidence/baseline-results.json
        run: |
          npx playwright test --config=playwright.preload-qa.config.mjs --project=webkit tests/all-component-styles.spec.mjs tests/solution-lab.spec.mjs tests/preload-waterfall.diagnostic.mjs --grep ' (breadcrumb en 390px|command-palette zh 390px|menu en 390px|multi-select en 390px|textarea en 390px):|a failed demo module can recover|preload waterfall' --reporter=line,json --output=diagnostic-baseline-results
      - name: 候选构建与哈希完整性检查
        id: candidate_build
        if: ${{ !cancelled() && steps.baseline_build.outcome == 'success' }}
        run: |
          npm run build -- --config astro.preload-qa.config.mjs
          node scripts/record-preload-build.mjs candidate
      - name: 同样故障与冷加载采样的候选对照
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: qa-evidence/candidate-results.json
        run: |
          npx playwright test --config=playwright.preload-qa.config.mjs --project=webkit tests/all-component-styles.spec.mjs tests/solution-lab.spec.mjs tests/preload-waterfall.diagnostic.mjs --grep ' (breadcrumb en 390px|command-palette zh 390px|menu en 390px|multi-select en 390px|textarea en 390px):|a failed demo module can recover|preload waterfall' --reporter=line,json --output=diagnostic-candidate-results
      - name: 记录诊断截图和工具版本
        if: ${{ always() }}
        run: |
          mkdir -p qa-evidence
          if [ -x node_modules/.bin/playwright ]; then node_modules/.bin/playwright --version > qa-evidence/playwright-version.txt; fi
          for dir in diagnostic-baseline-results diagnostic-candidate-results; do
            if [ -d "$dir" ]; then find "$dir" -type f -name '*.png' -print0; fi
          done | sort -z | xargs -0 -r sha256sum > qa-evidence/screenshots.sha256
      - name: 保存私有 A/B 证据（基线失败不隐藏）
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: atlas-preload-diagnostic-${{ github.sha }}
          path: |
            qa-evidence/
            diagnostic-baseline-results/
            diagnostic-candidate-results/
          if-no-files-found: error
          retention-days: 7
