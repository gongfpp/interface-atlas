name: 私有审计工作区快照
on:
  push:
    branches: [feature/atlas-quality-audit]
    paths: [.github/workflows/audit-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安装并锁定无障碍测试依赖
        run: |
          npm install --save-dev --save-exact --ignore-scripts @axe-core/playwright
          node -p "require('@axe-core/playwright/package.json').version"
          tar -czf /tmp/atlas-accessibility-runtime.tar.gz node_modules/@axe-core node_modules/axe-core package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: private-audit-accessibility-runtime
          path: /tmp/atlas-accessibility-runtime.tar.gz
          retention-days: 1
