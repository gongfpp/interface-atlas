name: 私有审计工作区快照
on:
  push:
    branches: [feature/atlas-quality-audit]
    paths: [.github/workflows/audit-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 打包隔离环境所需依赖（不含凭据）
        run: |
          cp "$(command -v node)" /tmp/audit-node
          tar -czf /tmp/interface-atlas-runtime.tar.gz node_modules -C /tmp audit-node
      - uses: actions/upload-artifact@v4
        with:
          name: private-audit-runtime
          path: /tmp/interface-atlas-runtime.tar.gz
          retention-days: 1
