name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 项目站点挂在 /interface-atlas/ 子路径；build:fast 复用已提交的关键词搜索索引，无需运行时模型
      # 埋点变量在仓库 Settings → Secrets and variables → Actions → Variables 配置（未配置则自动跳过）
      - name: Build
        run: npm run build:fast
        env:
          PUBLIC_SITE_URL: https://gongfpp.github.io
          PUBLIC_BASE_PATH: /interface-atlas
          # GitHub Pages 无 Functions/KV 后端，关闭查询落库，避免 404 噪声
          PUBLIC_LOG_API: 'off'
          PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
          PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
