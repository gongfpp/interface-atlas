name: Deploy site to interface-atlas-web

# 源码仓库公开；构建产物继续 push 到独立的 gongfpp/interface-atlas-web，
# 由该仓库的 GitHub Pages（branch: main, /）对外发布。机制与 Iscream → Iscream-web 一致。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  # 发布前先在同一提交上跑完整检查：检查不过就不发布
  verify:
    # 当前参考风格需求仅允许私有验收，不能从手动入口发布。
    if: ${{ github.ref != 'refs/heads/dot/atlas-reference-style-scenes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: 存储与复制回归
        run: npm run test:unit
      - name: Type check (astro check)
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: "Build (prebuild: content check + api layer + search index)"
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: npm run test:smoke
      - name: Golden query regression
        run: npm run search:test

  build-and-deploy:
    if: ${{ github.ref != 'refs/heads/dot/atlas-reference-style-scenes' }}
    needs: verify
    runs-on: ubuntu-latest
    env:
      WEB_REPOSITORY: git@github.com:gongfpp/interface-atlas-web.git
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 用完整 build：prebuild 会重建 public/api 与关键词搜索索引，
      # 只用 build:fast 会把仓库里提交的旧索引直接发布出去
      - name: Build GitHub Pages
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://gongfpp.github.io
          PUBLIC_BASE_PATH: /interface-atlas-web
          # GitHub Pages 无 Functions/KV 后端，关闭查询落库，避免 404
          PUBLIC_LOG_API: 'off'
          PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
          PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}

      # EdgeOne 从同一公开成品仓库读取专用目录，避免把 GitHub 的子路径用于根域名。
      - name: Build EdgeOne root site
        run: |
          npm run build -- --outDir dist-edgeone
          mv dist-edgeone dist/_edgeone
        env:
          PUBLIC_SITE_URL: https://atlas.gongfpp.icu
          PUBLIC_BASE_PATH: /
          PUBLIC_LOG_API: 'off'
          PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
          PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}

      - name: Publish to gongfpp/interface-atlas-web
        env:
          DEPLOY_KEY: ${{ secrets.WEB_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          # Astro 输出 /_astro/ 目录，必须禁用 Jekyll 处理
          touch dist/.nojekyll

          # 在已有公开仓库之上增量提交（不再 force-push）：
          # GitHub Pages 对 HTML 有 ~10 分钟缓存，若删除旧 hash 资源，
          # 缓存里的 HTML 会引用到已不存在的 CSS/JS 而导致页面无样式。
          if git clone --depth 1 "$WEB_REPOSITORY" web 2>/dev/null; then
            if [ -d web/_astro ]; then cp -a web/_astro /tmp/prev-astro; fi
            if [ -d web/_edgeone/_astro ]; then cp -a web/_edgeone/_astro /tmp/prev-edgeone-astro; fi
          else
            mkdir web && git -C web init -q
            git -C web remote add origin "$WEB_REPOSITORY"
          fi

          rsync -a --delete --exclude=.git --exclude=preview dist/ web/
          # 把本轮构建不再产出、但仍可能被缓存 HTML 引用的旧 _astro 资源放回去
          if [ -d /tmp/prev-astro ]; then cp -an /tmp/prev-astro/. web/_astro/ 2>/dev/null || true; fi
          if [ -d /tmp/prev-edgeone-astro ]; then cp -an /tmp/prev-edgeone-astro/. web/_edgeone/_astro/ 2>/dev/null || true; fi

          cd web
          git config user.name "interface-atlas-deploy"
          git config user.email "gongfpp@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -qm "deploy ${GITHUB_SHA}"
          git push origin HEAD:main

  deploy-cloudflare:
    if: ${{ github.ref != 'refs/heads/dot/atlas-reference-style-scenes' }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Cloudflare root site
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://interface-atlas-9po.pages.dev
          PUBLIC_BASE_PATH: /
          PUBLIC_LOG_API: 'off'
          PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
          PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      - name: Deploy Cloudflare Pages
        working-directory: dist
        run: npx --yes wrangler@4.152.0 pages deploy . --project-name interface-atlas --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
