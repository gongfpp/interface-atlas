description:
  zh: 8 张 AI 生成的输入框设计参考海报：从基础视觉结构、状态与操作、格式与约束， 到验证码、格式掩码、前后缀、步进器、字数限制、分段日期、富文本、语音输入与 快捷键录入——把"一个输入框到底能有多少形态"一次讲全。
  en: 'Eight AI-generated input-field reference posters: basic structure, states and actions, format constraints, then OTP fields, input masking, affixes, steppers, character counters, segmented dates, rich text, voice dictation and shortcut recording — every shape an input can take, in one sweep.'
