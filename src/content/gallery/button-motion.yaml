prompt:
  zh: 制作竖版「前端按钮动效风格参考」海报。米白背景、黑色粗标题、蓝色强调；每页纵向排列五个案例，左侧为编号、英文名、中文名和动效参数，右侧用四阶段小图展示真实按钮从初始、触发、过渡到完成的变化。准确呈现形变、颜色、描边和操作反馈；保留每个效果的触发方式与时长。
  en: Create a vertical frontend button-motion design poster. Use an off-white background, bold black heading, and blue accents. Arrange five numbered cases per sheet with bilingual names and motion parameters on the left and four real-looking button stages on the right. Show initial, triggered, transitional, and completed states with accurate shape, color, border, trigger, and duration.
tips:
  - zh: 图中的 40 种效果均有可操作的演示，入口位于本页上方。
    en: All 40 illustrated effects have interactive demos linked above.
