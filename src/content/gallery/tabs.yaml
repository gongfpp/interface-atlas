description:
  zh: >-
    8 张 AI 生成的标签页 / 分段控件设计参考海报：前四张是 20 个差异案例的图鉴，
    后四张是 20 个新增案例的补充——下划线式、胶囊式、卡片式、分段圆钮，
    到浏览器标签、垂直标签等边缘形态。
  en: >-
    Eight AI-generated tabs / segmented-control reference posters: the first four are
    an atlas of 20 distinct cases, the last four add 20 more — underline, pill, card
    and segmented styles through browser tabs and vertical tabs.

