description:
  zh: >-
    8 张 AI 生成的菜单 / 下拉菜单设计参考海报，每张围绕"组件结构 + 交互逻辑"
    展开 5 个案例：从基础操作菜单到分组、多级、右键、命令式菜单，
    覆盖触发方式、层级的完整谱系。
  en: >-
    Eight AI-generated menu/dropdown reference posters. Each sheet explores five cases
    around "component structure + interaction logic": from plain action menus to
    grouped, nested, context and command menus — the full spectrum of triggers and
    hierarchy.

related_component: dropdown

