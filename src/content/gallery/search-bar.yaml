    8 张 AI 生成的搜索框设计参考海报：从页头窄搜索框、居中大搜索框，到带筛选、
    带建议、带历史记录、结果内联展开的形态——搜索入口的完整决策空间。
  en: >-
    Eight AI-generated search-bar reference posters: slim header fields, centered
    hero search, filtered and suggest-enabled variants, history and inline results —
    the full decision space of a search entry point.

