prompt:
  zh: >-
    制作一张竖版「Search Bar 设计参考」海报，编号 NN。米白背景（#FAF9F5），黑色粗标题
    「Search Bar 设计参考 NN」+ 灰色小字 SEARCH BAR / DESIGN REFERENCE。正文纵向排列
    5 个条目，每条左侧是大号灰色序号 01～05、英文模式名（如 Header Search / Hero Search /
    Filter Search / Suggest Search / Inline Results）、中文模式名与 2×2 关键词短语；
    右侧浅灰圆角卡片内是真实感的搜索框演示（输入框、放大镜图标、占位文案、建议面板
    或结果列表，当前项高亮），底部一行灰色说明文字。排版网格严格、留白充足、扁平极简，
    蓝色仅作强调色，中英文对照，UI 细节逼真可放大。
  en: >-
    A vertical "Search Bar Design Reference" poster, sheet number NN. Off-white
    background (#FAF9F5), bold black Chinese-English title plus grey "SEARCH BAR /
    DESIGN REFERENCE" subtitle. Five numbered rows: large grey index, English pattern
    name (e.g. Header Search, Hero Search, Filter Search, Suggest Search, Inline
    Results), Chinese name and a 2x2 keyword grid; on the right, a realistic search
    demo inside a light-grey rounded card (input with magnifier icon, placeholder,
    suggestion panel or result list, highlighted active row) and a one-line caption.
    Strict grid, generous whitespace, flat minimal, blue accent only, bilingual labels,
    crisp zoomable UI details.

tips:
  - { zh: 搜索框演示务必包含「建议面板」这类展开内容，画面信息量立刻上来, en: Always include a suggestion panel — the sheet gains instant information density }
  - { zh: 编号连续生成时保持同一句式，整套图放在一起像一本册子, en: Keep the sentence template identical across sheets so the set reads like one booklet }
