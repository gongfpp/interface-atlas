prompt:
  zh: 制作竖版网页设计风格参考海报。采用米白背景、严格网格和中英文标题；逐项展示不同网页视觉风格，每个案例包含风格名称、设计关键词、具有完整导航与内容层次的真实网页缩景。让字体、色彩、材质、空间与组件共同表达风格，而不是只替换背景色。
  en: Create a vertical web-design style reference poster with an off-white background, a strict grid, and bilingual headings. Each case needs its style name, design keywords, and a realistic complete web-page composition. Express the style through typography, color, materials, spacing, and components rather than background changes alone.
