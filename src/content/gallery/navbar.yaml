prompt:
  zh: >-
    制作一张竖版「导航栏设计参考」海报，编号 N，右上角标注本张主题。米白背景（#FAF9F5），
    黑色粗标题「导航栏设计参考 N」+ 灰色小字 DESIGN REFERENCE。正文纵向排列 5 个条目，
    每条左侧是大号灰色序号 01～05、英文模式名（如 Top Navigation / Sidebar Navigation /
    Bottom Navigation / Tab Navigation / Mega Menu）、中文模式名与 2×2 关键词短语；
    右侧是浅灰圆角卡片内的真实感 UI 演示：完整的导航栏界面（品牌 Logo、菜单项、搜索图标、
    主按钮，当前项用蓝色下划线标记），卡片底部一行灰色说明文字。整张海报排版网格严格、
    留白充足、扁平极简风格，蓝色仅作强调色，所有文字为简体中文与英文对照，UI 细节逼真可放大。
  en: >-
    A vertical "Navigation Bar Design Reference" poster, sheet number N, with the sheet
    theme at the top right. Off-white background (#FAF9F5), bold black title in Chinese
    plus a grey "DESIGN REFERENCE" subtitle. Five numbered rows: each has a large grey
    index (01–05), the English pattern name (e.g. Top Navigation, Sidebar Navigation,
    Bottom Navigation, Tab Navigation, Mega Menu), its Chinese name, and a 2x2 grid of
    short keywords; on the right, a realistic UI demo inside a light-grey rounded card —
    a complete navbar with brand logo, menu items, search icon and primary button, the
    active item marked with a blue underline — and a one-line grey caption below. Strict
    grid, generous whitespace, flat minimal style, blue as the only accent, bilingual
    Chinese/English labels, crisp zoomable UI details.

tips:
  - { zh: 每张只换「本张主题」与 5 个模式名，其余描述保持不变，整批风格就统一, en: Keep everything fixed except the sheet theme and the five pattern names for a consistent series }
  - { zh: 生成后用 4K 分辨率重绘一版，UI 文字更清晰, en: Upscale at 4K for crisper in-UI text }
