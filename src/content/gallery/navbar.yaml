description:
  zh: >-
    8 张 AI 生成的导航栏设计参考海报：每张系统展开 5 个变体，从顶部主导航、侧边导航、
    底部导航、标签导航到超级菜单，再延伸到浮动胶囊、自动隐藏、上下文导航与翻页状态。
    适合在动手前快速过一遍"导航还有哪些做法"。
  en: >-
    Eight AI-generated navbar reference posters. Each sheet lays out five variants —
    from top / sidebar / bottom / tab navigation to mega menus, then floating pills,
    auto-hide headers, contextual navigation and prev/next states. A fast pre-flight
    scan of "what else could this navbar be".

related_component: navbar

