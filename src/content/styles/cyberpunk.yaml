status: published
name:
  zh: 赛博朋克
  en: Cyberpunk
aliases:
  - 赛博朋克
  - 赛博风格
  - 霓虹故障风
  - 黑底荧光紫青
  - 数字废土风
  - 黑客终端风
  - Cyberpunk UI
  - Neon Glitch
category:
  - Style
  - Visual Language
description:
  zh: '"High tech, low life" 的视觉语言：近黑的深底上，霓虹青与品红发光描边切割 界面，等宽字体与终端符号贯穿，扫描线 故障位移 毛刺纹理营造信息系统过载 的压抑未来感。光是从黑暗里切出来的，界面像一台被劫持的显示器。'
  en: '"High tech, low life" as a visual language: neon cyan and magenta edges cut through a near-black ground, monospace type and terminal glyphs run throughout, and scanlines plus glitch offsets suggest overloaded systems. Light is sliced out of darkness — the screen feels hijacked.'
use_when:
  - zh: 游戏 科幻项目 黑客主题社区，风格即世界观
    en: Games, sci-fi projects and hacker communities where style is worldbuilding
  - zh: 音乐 夜店 电竞品牌，需要强烈的亚文化信号
    en: Music, club and esports brands signaling subculture
  - zh: 深色为主的产品，可低成本叠加霓虹点缀
    en: Already-dark products that can layer neon accents cheaply
avoid_when:
  - zh: 无障碍要求高的正文阅读，荧光色对比闪烁伤眼
    en: Accessibility-critical reading — neon flicker and contrast hurt
  - zh: 企业级正式场景，亚文化气质会削弱信任
    en: Enterprise contexts where subculture erodes trust
  - zh: 浅色底为主的现有体系，硬切赛博朋克成本高
    en: Existing light-theme systems — a hard pivot is costly
tags:
  - cyberpunk
  - neon
  - glitch
  - terminal
  - dystopia
