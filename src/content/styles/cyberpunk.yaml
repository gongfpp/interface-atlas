playground:
  task:
    zh: "接入网络按所选街区离线接入并可断开；勾选/取消装备后 HUD 同步显示街区、连接和装备状态。街区、装备、黑市、SYS 状态各有本地内容，不真实联网或交易。"
    en: "Connect to the network establishes an offline district connection and can disconnect. Toggle gear to update the district, connection and loadout HUD. Districts, Gear, Black market and SYS status reveal local content without real networking or trades."
  checks:
    - zh: "逐一操作 NEON://CITY 原导航和主 CTA，检查对应内容与返回路径，不只是点击提示。"
      en: "Use NEON://CITY’s original navigation and primary CTAs; inspect content and return paths, not just click notices."
    - zh: "完成上述 NEON://CITY 操作后修改输入或撤销，检查结果与状态同步。"
      en: "Complete the NEON://CITY task, then change inputs or undo and inspect the matching result/state."
    - zh: "用键盘和 390px / 320px 检查重排、焦点、校验；区分工具栏重载和内部清空，核对刷新后状态复位。"
      en: "Check reflow, focus and validation with keyboard and 390px / 320px viewports; distinguish toolbar reload from in-page clearing and inspect reset-on-reload boundaries."
sources:
  - name: Wikipedia — Cyberpunk derivatives
    url: https://en.wikipedia.org/wiki/Cyberpunk_derivatives
  - name: MDN — CSS animations
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_animations
implementation:
  css:
    - 'box-shadow: 0 0 8px #0ff'
    - text-shadow
    - clip-path
    - '@keyframes signal-connect'
    - repeating-linear-gradient
  notes:
    zh: NEON://CITY 使用深夜蓝黑、青色实体细线与高对比等宽字。右侧是标有三个街区的原创城市信号图，装饰地图不充当可点击控件；弱化泛光和卡片底色，保留清楚的层级。工作台以真实连接文字、装备复选框和一次性阶梯信号柱反馈状态，不持续闪烁。
    en: >-
      NEON://CITY uses midnight blue-black, solid cyan rules and high-contrast monospace type. An original three-district signal map replaces the chart; the decorative map is not an interactive control. Reduce ambient glow and card fills. The terminal exposes real connection text, gear checkboxes and a single stepped signal animation, without perpetual flashing.
prompts:
  basic:
    zh: 用赛博朋克风格（Cyberpunk）设计界面：近黑深底、霓虹青与品红发光描边、 切角面板、等宽终端字体，辅以扫描线与故障效果。
    en: >-
      "Design an interface in Cyberpunk style: near-black ground, glowing neon cyan and magenta edges, corner-cut
      panels, monospace terminal type, scanlines and glitch accents."
  design:
    zh: >-
      赛博朋克设计规范：底色 #0d0b14；主霓虹青 #00E5FF、辅品红 #FF2E88，发光 半径 8px 内；面板用 clip-path 切角代替圆角，1px 霓虹描边 + 同色微光； 文字用等宽字体（JetBrains
      Mono/系统 mono），标题可双层 RGB 错位；扫描线 叠层 opacity 0.05；交互元素 hover 时描边加亮；深浅模式仅做深色（浅色 底违背风格本体）。
    en: >-
      "Cyberpunk spec: ground #0d0b14; neon cyan #00E5FF primary, magenta #FF2E88 secondary, glow radius under 8px;
      corner-cut panels via clip-path with 1px neon borders and faint glow; monospace type (JetBrains Mono/system mono);
      headings with two-layer RGB offset; scanline overlay at 0.05 opacity; hover brightens borders. Dark only — a light
      ground contradicts the style."
  implementation:
    zh: >-
      以 /styles/cyberpunk/ 为整页入口。标题表达：SIGNAL / ACCESS；页面气质：霓虹之下，界面即城市。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title title
      title" "notes art variants" "notes art controls" "prompt prompt prompt"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 霓虹都市、终端黑客、故障艺术，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 120ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。
    en: >-
      Build the full /en/styles/cyberpunk/ page. Display direction: SIGNAL / ACCESS; Beneath the neon, the interface is
      a city.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and components.
      Desktop grid areas: "title title title" "notes art variants" "notes art controls" "prompt prompt prompt". Do not
      just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Neon City, Terminal Hacker, Glitch Art. Update the design and prompt without overwriting manual edits.
      Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching, style
      guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 120ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.
  agent:
    zh: >-
      以 /styles/cyberpunk/ 为整页入口。标题表达：SIGNAL / ACCESS；页面气质：霓虹之下，界面即城市。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title title
      title" "notes art variants" "notes art controls" "prompt prompt prompt"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 霓虹都市、终端黑客、故障艺术，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 120ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。


      先核对设计稿的构图、比例、字体、素材、组件和交互，再修改代码。不要把生成图当成可点击网页或实机截图；素材不含伪按钮与伪文字。验证首页始终可见可点、弹层历史、编辑保留、复制失败、键盘、移动端溢出与减少动态效果。使用
      tests/atlas-pages.spec.mjs 保存真实浏览器截图与操作结果，报告未达成项。
    en: >-
      Build the full /en/styles/cyberpunk/ page. Display direction: SIGNAL / ACCESS; Beneath the neon, the interface is
      a city.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and components.
      Desktop grid areas: "title title title" "notes art variants" "notes art controls" "prompt prompt prompt". Do not
      just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Neon City, Terminal Hacker, Glitch Art. Update the design and prompt without overwriting manual edits.
      Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching, style
      guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 120ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.


      Compare composition, proportions, typography, artwork and interactions before changing code. Never treat a
      generated image as a functional page or runtime screenshot. Verify Home visibility, dialog history, preserved
      edits, clipboard failure, keyboard, narrow layouts and reduced motion. Capture actual screenshots and outcomes
      with tests/atlas-pages.spec.mjs and report remaining gaps.
style_spec:
  typography:
    zh: 等宽字体 + 霓虹发光标题
    en: Monospace type with neon glow titles
  color:
    zh: '深夜蓝黑 #0B0F1A × 青色 #00E5FF'
    en: 'Night navy #0B0F1A with cyan #00E5FF'
  border:
    zh: 1px 霓虹青色边框，小圆角
    en: 1px neon cyan borders, tiny radius
  shadow:
    zh: 青色霓虹光晕 box-shadow
    en: Cyan neon glow shadows
  spacing:
    zh: 终端式紧凑排布
    en: Terminal-dense layout
  motion:
    zh: 120ms 的霓虹瞬时点亮过渡，尊重 prefers-reduced-motion
    en: 120ms neon ignition transitions; honour prefers-reduced-motion
  states:
    zh: hover 增亮青色霓虹；focus 用 2px 青色可见描边；active 反向闪烁一次；disabled 降为暗灰去光；error 用洋红霓虹
    en: Hover brightens the cyan neon; focus shows a visible 2px cyan outline; active flickers inverted once; disabled fades to dim grey without glow; error uses magenta neon

