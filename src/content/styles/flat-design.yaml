status: published
name:
  zh: 扁平化设计
  en: Flat Design
aliases:
  - 扁平化
  - 扁平风格
  - 扁平化设计
  - 没有阴影那种平面设计
  - 色块图标风格
  - 扁平UI
  - Flat UI
  - Flat Design
category:
  - Style
  - Visual Language
description:
  zh: 拒绝一切拟真修饰的视觉语言：纯色块、几何形状、无渐变无投影无纹理，靠颜色、 形状与排版建立层级。它是拟物化的反面——界面不再模仿实物，而是承认自己 是一块发光的平面，用清晰与直接换取效率与一致性。
  en: 'A visual language that strips out all simulation: solid color blocks, simple geometry, no gradients, shadows or textures. Hierarchy comes from color, shape and typography alone. The opposite of skeuomorphism — the interface admits it is a glowing plane and trades decoration for clarity.'
use_when:
  - zh: 系统级产品需要跨平台一致与极低成本维护
    en: System products that need cross-platform consistency at low cost
  - zh: 图标 信息图 后台界面，要求一眼识别 快速扫读
    en: Icons, infographics and dashboards that must scan instantly
  - zh: 移动端小屏幕，装饰会挤占内容空间
    en: Small mobile screens where decoration crowds out content
avoid_when:
  - zh: 层级复杂且用户需要空间线索区分可点与不可点
    en: Complex hierarchies where users need depth cues to see what is clickable
  - zh: 品牌需要温度 情绪与精致感
    en: Brands that need warmth, emotion or crafted refinement
  - zh: 大面积灰底上加细线按钮，可点性暗示不足（ Flat 2.0 随之出现）
    en: Grey on grey with hairline buttons — weak affordance triggered Flat 2.0
tags:
  - flat
  - solid-color
  - geometry
  - clarity
  - metro
variants:
  - id: metro
    name:
      zh: Metro 磁贴
      en: Metro Tiles
    note:
      zh: 微软 Metro，大色块磁贴与矩形至上
      en: Microsoft Metro — big color tiles, rectangles all the way
  - id: flat-ui
    name:
      zh: Flat UI 撞色
      en: Flat UI Colors
    note:
      zh: 高饱和撞色 加浅底 圆角与细描边
      en: Saturated clash colors on pale surfaces with 1px borders
  - id: flat2
    name:
      zh: 扁平 2.0
      en: Flat 2.0
    note:
      zh: 补回轻微阴影与层次，Material 前奏
      en: Shadows return subtly — the prelude to Material
