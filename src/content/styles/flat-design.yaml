playground:
  task:
    zh: "开始使用创建具名工作区并选择 plan，结果显示对应名称与方案；功能、价格、博客、登录各到达具体内容或演示身份说明。"
    en: "Get started creates a named workspace with a chosen plan and shows the matching result. Features, Pricing, Blog and Log in reach relevant content or a demo identity explanation."
  checks:
    - zh: "逐一操作 Flatly 原导航和主 CTA，检查对应内容与返回路径，不只是点击提示。"
      en: "Use Flatly’s original navigation and primary CTAs; inspect content and return paths, not just click notices."
    - zh: "完成上述 Flatly 操作后修改输入或撤销，检查结果与状态同步。"
      en: "Complete the Flatly task, then change inputs or undo and inspect the matching result/state."
    - zh: "用键盘和 390px / 320px 检查重排、焦点、校验；区分工具栏重载和内部清空，核对刷新后状态复位。"
      en: "Check reflow, focus and validation with keyboard and 390px / 320px viewports; distinguish toolbar reload from in-page clearing and inspect reset-on-reload boundaries."
sources:
  - name: Nielsen Norman Group — Flat Design
    url: https://www.nngroup.com/articles/flat-design/
  - name: Apple HIG — Visual Design
    url: https://developer.apple.com/design/human-interface-guidelines/visual-design
implementation:
  css:
    - solid-color
    - 'border: 0'
    - 'box-shadow: none'
    - 'transition: background-color'
  notes:
    zh: 纪律比技巧重要：只允许纯色填充与 1px 描边，box-shadow 一律 none，渐变与 纹理一律不出现；层级交给色块面积与明度差。可交互元素用高饱和强调色或 描边保证可点性；hover 只改 background-color，150ms 内完成。深浅色模式 各维护一套色板而非简单反色。
    en: 'Discipline over technique: solid fills and 1px borders only, box-shadow always none, gradients and textures banned. Hierarchy lives in color area and luminance steps. Keep interactive elements on saturated accents or clear outlines; hover changes background-color only, within 150ms. Maintain separate light and dark palettes instead of inverting.'
prompts:
  basic:
    zh: 用扁平化设计（Flat Design）风格设计界面：纯色块、无渐变无投影无纹理， 层级靠颜色与排版建立，交互元素用高饱和强调色标识。
    en: >-
      "Design an interface in Flat Design style: solid color blocks with no gradients, shadows or textures; hierarchy
      from color and typography; interactive elements marked by saturated accents."
  design:
    zh: >-
      扁平化设计规范：背景纯白或纯灰，内容用 5～6 个高饱和色块（参考 Flat UI Colors：#3498DB #E74C3C #2ECC71 等）；无边框无投影，圆角 0～4px；文字 反白或近黑，字号层级清晰；按钮
      hover 仅加深背景色 8%；深色模式单独 调整色板明度，不做简单反色。
    en: >-
      "Flat design spec: white or light grey background with 5–6 saturated tiles (Flat UI Colors: #3498DB, #E74C3C,
      #2ECC71...); no borders, no shadows, 0–4px radii; inverted or near-black text with clear type scale; hover darkens
      the fill by 8% only; dark mode uses its own palette, not a simple inversion."
  implementation:
    zh: >-
      以 /styles/flat-design/ 为整页入口。标题表达：CLARITY IN ACTION；页面气质：清楚的层次，直接的操作。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title
      title title" "notes art variants" "notes art controls" "notes prompt prompt"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 Metro 磁贴、Flat UI 撞色、扁平 2.0，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生
      dialog 打开，支持 Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 150ms，减少动态效果时取消动画。桌面、390px、320px
      按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。
    en: >-
      Build the full /en/styles/flat-design/ page. Display direction: CLARITY IN ACTION; Clear hierarchy. Direct
      action.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and components.
      Desktop grid areas: "title title title" "notes art variants" "notes art controls" "notes prompt prompt". Do not
      just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Metro Tiles, Flat UI Colors, Flat 2.0. Update the design and prompt without overwriting manual edits.
      Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching, style
      guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 150ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.
  agent:
    zh: >-
      以 /styles/flat-design/ 为整页入口。标题表达：CLARITY IN ACTION；页面气质：清楚的层次，直接的操作。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title
      title title" "notes art variants" "notes art controls" "notes prompt prompt"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 Metro 磁贴、Flat UI 撞色、扁平 2.0，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生
      dialog 打开，支持 Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 150ms，减少动态效果时取消动画。桌面、390px、320px
      按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。


      先核对设计稿的构图、比例、字体、素材、组件和交互，再修改代码。不要把生成图当成可点击网页或实机截图；素材不含伪按钮与伪文字。验证首页始终可见可点、弹层历史、编辑保留、复制失败、键盘、移动端溢出与减少动态效果。使用
      tests/atlas-pages.spec.mjs 保存真实浏览器截图与操作结果，报告未达成项。
    en: >-
      Build the full /en/styles/flat-design/ page. Display direction: CLARITY IN ACTION; Clear hierarchy. Direct
      action.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and components.
      Desktop grid areas: "title title title" "notes art variants" "notes art controls" "notes prompt prompt". Do not
      just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Metro Tiles, Flat UI Colors, Flat 2.0. Update the design and prompt without overwriting manual edits.
      Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching, style
      guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 150ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.


      Compare composition, proportions, typography, artwork and interactions before changing code. Never treat a
      generated image as a functional page or runtime screenshot. Verify Home visibility, dialog history, preserved
      edits, clipboard failure, keyboard, narrow layouts and reduced motion. Capture actual screenshots and outcomes
      with tests/atlas-pages.spec.mjs and report remaining gaps.
style_spec:
  typography:
    zh: 几何无衬线，中等字重
    en: Geometric sans at medium weights
  color:
    zh: '纯色平涂：蓝 #1FA2FF × 黄 #FFD54F'
    en: 'Flat fills: blue #1FA2FF, yellow #FFD54F'
  border:
    zh: 无描边，色块分区
    en: No outlines — blocks define areas
  shadow:
    zh: 完全无阴影
    en: Completely shadowless
  spacing:
    zh: 小圆角 6px，均匀网格
    en: Small 6px radius, even grid
  motion:
    zh: 100–150ms 颜色与透明度的线性过渡，无位移
    en: Linear 100–150ms colour and opacity transitions, no movement
  states:
    zh: hover 用更亮的平涂色；focus 用 2px 深色可见实线外框；active 换用更深色块；disabled 降到 50% 不透明；error 用红色平涂且不加阴影
    en: Hover uses a brighter flat fill; focus shows a visible 2px dark solid frame; active uses a deeper fill; disabled drops to 50% opacity; error uses a red flat fill with no shadow

