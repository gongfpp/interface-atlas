playground:
  task:
    zh: "免费开始与立即体验进入创作区，输入想法生成可编辑的本地草稿；灵感助手、演示同步和原「多格式导出」入口解释对应功能，实际支持将当前草稿导出为 .txt；可保存/恢复本页快照并返回编辑。明确 AI 与云同步只是本地模拟。"
    en: "Start creating and Try it now open creation. Turn an idea into an editable local draft; assistant, simulated sync and the original Flexible export entry explain the corresponding features. Actual export saves the current draft as .txt; save/restore a page snapshot and return to editing. Label AI and cloud sync as local simulations."
  checks:
    - zh: "逐一操作 Aurora 原导航和主 CTA，检查对应内容与返回路径，不只是点击提示。"
      en: "Use Aurora’s original navigation and primary CTAs; inspect content and return paths, not just click notices."
    - zh: "完成上述 Aurora 操作后修改输入或撤销，检查结果与状态同步。"
      en: "Complete the Aurora task, then change inputs or undo and inspect the matching result/state."
    - zh: "用键盘和 390px / 320px 检查重排、焦点、校验；区分工具栏重载和内部清空，核对刷新后状态复位。"
      en: "Check reflow, focus and validation with keyboard and 390px / 320px viewports; distinguish toolbar reload from in-page clearing and inspect reset-on-reload boundaries."
sources:
  - name: Apple HIG — Materials
    url: https://developer.apple.com/design/human-interface-guidelines/materials
  - name: MDN — backdrop-filter
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/backdrop-filter
implementation:
  css:
    - 'backdrop-filter: blur()'
    - 'background: rgba(255,255,255,0.1~0.4)'
    - 'border: 1px solid rgba(255,255,255,0.4)'
    - 'box-shadow: inset 0 1px 0 rgba(255,255,255,0.5)'
    - '@supports'
  notes:
    zh: 玻璃三要素：半透明填充（白色 10%～40% 透明度）、backdrop-filter blur(8~24px)、 顶部 1px 半透明白描边制造玻璃厚度。深色底上玻璃效果最典型，可再叠一层顶部 内发光。务必用 @supports 为不支持 backdrop-filter 的环境准备降级（提高填充 不透明度）。文字对比度要按模糊后的实际背景校验。
    en: 'Three ingredients: a translucent fill (white at 10–40% opacity), backdrop-filter blur(8–24px), and a 1px translucent white top rim that sells the glass thickness. It shines on dark backgrounds — add an inner top glow. Always gate with @supports and fall back to a more opaque fill where backdrop-filter is unsupported. Verify text contrast against the blurred result, not the raw backdrop.'
prompts:
  basic:
    zh: 用玻璃拟态风格（Glassmorphism）设计界面：半透明磨砂玻璃面板，背景模糊透出底下的渐变或照片，配细白色高光描边。
    en: >-
      "Design an interface in Glassmorphism style: translucent frosted-glass panels that blur and reveal a gradient or
      photo beneath, edged with a thin white highlight."
  design:
    zh: >-
      玻璃拟态设计规范：页面背景为鲜艳渐变或照片（深色背景效果最佳）；玻璃面板 填充 rgba(255,255,255,0.15) 左右，backdrop-filter blur(16px)；描边用 1px
      rgba(255,255,255,0.35)，顶部可加内发光高光；圆角 16px+；玻璃上的文字保证 4.5:1 对比度。深色模式用更深的渐变底，玻璃透明度略升。
    en: >-
      "Glassmorphism design spec: a vivid gradient or photo background (dark works best); panels filled with
      rgba(255,255,255,0.15) and backdrop-filter blur(16px); 1px rgba(255,255,255,0.35) rims with an optional inner top
      glow; radii 16px+; text on glass must keep 4.5:1 contrast. Dark mode deepens the backdrop and slightly raises
      transparency."
  implementation:
    zh: >-
      以 /styles/glassmorphism/ 为整页入口。标题表达：A WINDOW INTO LIGHT；页面气质：在清晰与朦胧之间，看见层次。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为
      "title art controls" "variants art notes" "prompt prompt prompt"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 磨砂、透明玻璃、有色玻璃，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 240ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。
    en: >-
      Build the full /en/styles/glassmorphism/ page. Display direction: A WINDOW INTO LIGHT; Find depth between clarity
      and diffusion.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and
      components. Desktop grid areas: "title art controls" "variants art notes" "prompt prompt prompt". Do not just
      recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Frost, Clear Glass, Tinted Glass. Update the design and prompt without overwriting manual edits. Native
      dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching, style guide and
      editable prompts; select text for manual copy when clipboard access fails. Base transition: 240ms, disabled with
      reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.
  agent:
    zh: >-
      以 /styles/glassmorphism/ 为整页入口。标题表达：A WINDOW INTO LIGHT；页面气质：在清晰与朦胧之间，看见层次。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为
      "title art controls" "variants art notes" "prompt prompt prompt"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 磨砂、透明玻璃、有色玻璃，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 240ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。


      先核对设计稿的构图、比例、字体、素材、组件和交互，再修改代码。不要把生成图当成可点击网页或实机截图；素材不含伪按钮与伪文字。验证首页始终可见可点、弹层历史、编辑保留、复制失败、键盘、移动端溢出与减少动态效果。使用
      tests/atlas-pages.spec.mjs 保存真实浏览器截图与操作结果，报告未达成项。
    en: >-
      Build the full /en/styles/glassmorphism/ page. Display direction: A WINDOW INTO LIGHT; Find depth between clarity
      and diffusion.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and
      components. Desktop grid areas: "title art controls" "variants art notes" "prompt prompt prompt". Do not just
      recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Frost, Clear Glass, Tinted Glass. Update the design and prompt without overwriting manual edits. Native
      dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching, style guide and
      editable prompts; select text for manual copy when clipboard access fails. Base transition: 240ms, disabled with
      reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.


      Compare composition, proportions, typography, artwork and interactions before changing code. Never treat a
      generated image as a functional page or runtime screenshot. Verify Home visibility, dialog history, preserved
      edits, clipboard failure, keyboard, narrow layouts and reduced motion. Capture actual screenshots and outcomes
      with tests/atlas-pages.spec.mjs and report remaining gaps.
style_spec:
  typography:
    zh: 无衬线，白色大标题
    en: Sans-serif with white display type
  color:
    zh: 蓝紫粉渐变底 × 白色玻璃 rgba(255,255,255,.45)
    en: Blue-purple-pink gradient with white glass rgba(255,255,255,.45)
  border:
    zh: 1px 半透明白边框
    en: 1px translucent white borders
  shadow:
    zh: 大范围柔和彩色投影
    en: Large soft coloured shadows
  spacing:
    zh: 圆角 16px+，卡片内边距充足
    en: 16px+ radii with roomy card padding
  motion:
    zh: 200–300ms ease-out 的位移与模糊过渡，尊重 prefers-reduced-motion
    en: 200–300ms ease-out transitions for movement and blur; honour prefers-reduced-motion
  states:
    zh: hover 提升透明度与模糊并轻微上浮；focus 用白色可见亮环；active 压低光晕；disabled 降不透明并去模糊；error 用红调玻璃且仅淡入颜色
    en: Hover raises opacity and blur and lifts slightly; focus shows a visible white ring; active lowers the glow; disabled loses opacity and blur; error tints the glass red, fading colour only

