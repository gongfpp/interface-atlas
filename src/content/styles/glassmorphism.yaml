status: published
name:
  zh: 玻璃拟态
  en: Glassmorphism
aliases:
  - 毛玻璃
  - 苹果那种透明玻璃效果
  - 玻璃拟态
  - 磨砂玻璃
  - 玻璃效果
  - 半透明模糊背景
  - Frosted Glass
  - Glassmorphism UI
category:
  - Style
  - Visual Language
description:
  zh: 用半透明磨砂玻璃质感表示悬浮层级的视觉语言：backdrop-filter 背景模糊 + 低透明度 填充 + 一圈细窄的白色高光描边，让面板像磨砂玻璃片一样透出底下的色彩与图形。 它强调"层"——玻璃之下必须有可透出的丰富背景，否则质感无从谈起。
  en: 'A visual language that expresses floating layers as frosted glass: a blurred backdrop (backdrop-filter), a low-opacity fill and a thin white rim of light. Panels literally reveal the vivid background beneath them, so the style is about depth — it only works over rich, colorful content worth revealing.'
use_when:
  - zh: 背景是渐变 照片或彩色内容，需要透出层次
    en: Over gradients, photos or colorful backdrops worth revealing
  - zh: 弹层 播放器 系统级悬浮面板，要轻盈不要沉闷
    en: Overlays, players and floating system panels that should feel light
  - zh: 想延续 macOS iOS 的材质语言获得熟悉感
    en: Evoking the familiar macOS/iOS material language
avoid_when:
  - zh: 背景纯净单调，玻璃无内容可透 出来只剩灰雾
    en: Plain backgrounds — frosted glass over nothing is just grey fog
  - zh: 长文本密集区域，模糊底会持续削弱文字对比度
    en: Long-form reading areas where blur keeps eroding text contrast
  - zh: 低端设备兼容与性能敏感场景，backdrop-filter 开销大
    en: Performance-sensitive or older devices — backdrop-filter is costly
tags:
  - glass
  - blur
  - transparency
  - depth
  - material
variants:
  - id: frost
    name:
      zh: 磨砂
      en: Frost
    note:
      zh: 高模糊低透明，最经典的奶白玻璃
      en: High blur, low opacity — the classic milky glass
  - id: clear
    name:
      zh: 透明玻璃
      en: Clear Glass
    note:
      zh: 低模糊高透明，更依赖高光描边
      en: Light blur, high transparency, leans on the light rim
  - id: tinted
    name:
      zh: 有色玻璃
      en: Tinted Glass
    note:
      zh: 带色调的玻璃，iOS 振动感传统
      en: Color-tinted glass, the iOS vibrancy tradition
