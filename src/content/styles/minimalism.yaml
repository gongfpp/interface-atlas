status: published
name:
  zh: 极简主义
  en: Minimalism
aliases:
  - 极简风
  - 简约风格
  - 性冷淡风
  - 大量留白那种设计
  - 性冷淡设计
  - Minimal
  - Minimalist Design
  - Less is more
category:
  - Style
  - Visual Language
description:
  zh: 以"少即是多"为准则的视觉语言：用大量留白、克制的黑白灰配色与有限字体层级 来凸显内容本身，删除一切装饰性元素，层级完全依靠空间、字重与疏密建立。 安静、克制、内容至上是它的气质。
  en: 'A visual language built on "less is more": generous whitespace, a restrained monochrome palette and very few type scales let the content speak. All decoration is stripped away; hierarchy is created purely by space, weight and rhythm. Quiet, restrained, content-first.'
use_when:
  - zh: 内容为王的产品——阅读、写作、摄影、作品集
    en: Content-first products — reading, writing, photography, portfolios
  - zh: 想传达专业、克制、高端的品牌气质
    en: Conveying a professional, restrained, premium brand voice
  - zh: 元素少而结构清晰的页面（官网首屏、详情页）
    en: Pages with few elements and clear structure (hero, detail pages)
avoid_when:
  - zh: 信息密度高的后台与数据界面，过度留白牺牲效率
    en: Dense dashboards — excessive whitespace wastes efficiency
  - zh: 需要情绪浓度与热闹感的营销、娱乐、节庆场景
    en: Marketing or festive contexts that need energy and warmth
  - zh: 可用元素很少时容易显得"空而廉价"，需极强排版功底兜底
    en: Without strong typographic skill it reads as empty rather than elegant
tags:
  - minimal
  - whitespace
  - typography
  - clean
  - content-first
variants:
