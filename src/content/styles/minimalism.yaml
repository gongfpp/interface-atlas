playground:
  task:
    zh: "立即体验进入专注设备系列，立即购买查看设备规格和款式；切换三条生活灵感，选择设备并查看本地购物结果，不创建订单。"
    en: "Explore Lumo opens the focus-device collection; Shop now shows device specifications and finishes. Cycle three daily rituals, select a device and inspect the local shopping result without placing an order."
  checks:
    - zh: "逐一操作 LUMO 原导航和主 CTA，检查对应内容与返回路径，不只是点击提示。"
      en: "Use LUMO’s original navigation and primary CTAs; inspect content and return paths, not just click notices."
    - zh: "完成上述 LUMO 操作后修改输入或撤销，检查结果与状态同步。"
      en: "Complete the LUMO task, then change inputs or undo and inspect the matching result/state."
    - zh: "用键盘和 390px / 320px 检查重排、焦点、校验；区分工具栏重载和内部清空，核对刷新后状态复位。"
      en: "Check reflow, focus and validation with keyboard and 390px / 320px viewports; distinguish toolbar reload from in-page clearing and inspect reset-on-reload boundaries."
sources:
  - name: Apple HIG — Visual Design
    url: https://developer.apple.com/design/human-interface-guidelines/visual-design
  - name: Dieter Rams — 10 Principles of Good Design
    url: https://www.vitsoe.com/us/about/good-design
implementation:
  css:
    - whitespace
    - font-weight
    - letter-spacing
    - 'border: 1px solid'
    - grid
  notes:
    zh: 核心是排版与留白：建立 3 档以内的字号层级与克制的行高；配色收敛到黑 白 灰 外加至多一个强调色；边框只用 1px 发丝线或干脆用留白分隔；按钮以实心黑或 描边两种形态为主，禁用投影与渐变。先删到不能再删，再谈精致。
    en: 'Typography and whitespace carry the design: at most three type sizes with restrained line-height; a palette of black, white, grey plus at most one accent; separate with 1px hairlines or pure space instead of boxes; buttons are solid black or outlined, no shadows or gradients. Remove everything first, then refine what remains.'
prompts:
  basic:
    zh: 用极简主义风格（Minimalism）设计界面：大量留白、黑白灰配色、无装饰，层级靠字号字重与空间建立。
    en: >-
      "Design an interface in Minimalism style: generous whitespace, a monochrome palette, zero decoration, hierarchy
      built from type scale and space alone."
  design:
    zh: >-
      极简主义风格设计规范：底色纯白，文字近黑（#111）；字号层级 3 档以内，标题 用大字号加收紧字距；配色只有黑 白 灰 + 一个强调色；分隔用 1px 发丝线或留白， 禁止投影 渐变 纹理；按钮为实心黑或 1px
      描边两种；整体留白至少是内容高度的 一半。支持深色模式（近黑底 反白字）。
    en: >-
      Minimalism design spec: pure white surface, near-black text (#111); at most three type sizes with tight heading
      tracking; palette limited to black, white, grey plus one accent; separate with 1px hairlines or whitespace — no
      shadows, gradients or textures; buttons are solid black or 1px outlined; whitespace at least half the content
      height. Dark mode: near-black surface, inverted text.
  implementation:
    zh: >-
      以 /styles/minimalism/ 为整页入口。标题表达：A quieter way.；页面气质：让界面，留一点呼吸。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title title"
      "art art" "notes variants" "prompt controls"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 黑白极简、扁平极简、暖调极简，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 200ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。
    en: >-
      Build the full /en/styles/minimalism/ page. Display direction: A quieter way.; Leave a little room to breathe..
      Follow the latest whole-page image proposal for layout, typography, artwork, materials and components. Desktop
      grid areas: "title title" "art art" "notes variants" "prompt controls". Do not just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Monochrome Minimal, Flat Minimal, Warm Minimal. Update the design and prompt without overwriting manual
      edits. Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching,
      style guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 200ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.
  agent:
    zh: >-
      以 /styles/minimalism/ 为整页入口。标题表达：A quieter way.；页面气质：让界面，留一点呼吸。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title title"
      "art art" "notes variants" "prompt controls"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 黑白极简、扁平极简、暖调极简，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 200ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。


      先核对设计稿的构图、比例、字体、素材、组件和交互，再修改代码。不要把生成图当成可点击网页或实机截图；素材不含伪按钮与伪文字。验证首页始终可见可点、弹层历史、编辑保留、复制失败、键盘、移动端溢出与减少动态效果。使用
      tests/atlas-pages.spec.mjs 保存真实浏览器截图与操作结果，报告未达成项。
    en: >-
      Build the full /en/styles/minimalism/ page. Display direction: A quieter way.; Leave a little room to breathe..
      Follow the latest whole-page image proposal for layout, typography, artwork, materials and components. Desktop
      grid areas: "title title" "art art" "notes variants" "prompt controls". Do not just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Monochrome Minimal, Flat Minimal, Warm Minimal. Update the design and prompt without overwriting manual
      edits. Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching,
      style guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 200ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.


      Compare composition, proportions, typography, artwork and interactions before changing code. Never treat a
      generated image as a functional page or runtime screenshot. Verify Home visibility, dialog history, preserved
      edits, clipboard failure, keyboard, narrow layouts and reduced motion. Capture actual screenshots and outcomes
      with tests/atlas-pages.spec.mjs and report remaining gaps.
style_spec:
  typography:
    zh: 衬线大标题 + 无衬线灰阶正文
    en: Serif display with grey sans body
  color:
    zh: '米白 #FAFAF8 × 近黑 #161513，单一强调色'
    en: 'Off-white #FAFAF8 × near-black #161513, one accent'
  border:
    zh: '无边框，或 1px #EDEDE9 细分隔线'
    en: 'Frameless; 1px #EDEDE9 hairlines at most'
  shadow:
    zh: 几乎无阴影，层次靠灰度
    en: No shadows — depth via greyscale
  spacing:
    zh: 极大留白，宽松的 8pt 网格
    en: Generous whitespace on a relaxed 8pt grid
  motion:
    zh: 150ms 内只做颜色与透明度过渡，无位移
    en: Colours and opacity only, under 150ms, no movement
  states:
    zh: hover 只变颜色；focus 用黑色发丝可见外框；active 轻微加深；disabled 降到 40% 不透明；error 用单一红
    en: Hover changes colour only; focus shows a black hairline ring; active darkens slightly; disabled drops to 40% opacity; error uses a single red

