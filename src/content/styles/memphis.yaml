      先核对设计稿的构图、比例、字体、素材、组件和交互，再修改代码。不要把生成图当成可点击网页或实机截图；素材不含伪按钮与伪文字。验证首页始终可见可点、弹层历史、编辑保留、复制失败、键盘、移动端溢出与减少动态效果。使用
      tests/atlas-pages.spec.mjs 保存真实浏览器截图与操作结果，报告未达成项。
    en: >-
      Build the full /en/styles/memphis/ page. Display direction: BREAK THE GRID.; Colour, geometry and a little
      disorder.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and components.
      Desktop grid areas: "title title variants" "notes art controls" "notes prompt prompt". Do not just recolour a
      template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Classic Memphis, Terrazzo, Neo-Memphis. Update the design and prompt without overwriting manual edits.
      Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching, style
      guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 180ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.


      Compare composition, proportions, typography, artwork and interactions before changing code. Never treat a
      generated image as a functional page or runtime screenshot. Verify Home visibility, dialog history, preserved
      edits, clipboard failure, keyboard, narrow layouts and reduced motion. Capture actual screenshots and outcomes
      with tests/atlas-pages.spec.mjs and report remaining gaps.
style_spec:
  typography:
    zh: 无衬线粗标题，随性排版
    en: Bold sans with playful type
  color:
    zh: '奶油底 × 粉 #FF5C8A 黄 #FFD23F 青 #3EC6A8'
    en: 'Cream base; pink #FF5C8A, yellow #FFD23F, teal #3EC6A8'
  border:
    zh: 2px 黑边
    en: 2px black outlines
  shadow:
    zh: 4px 4px 0 位移硬投影
    en: 4px 4px 0 offset hard shadows
  spacing:
    zh: 故意歪斜、错位排布
    en: Deliberately tilted, misaligned
  motion:
    zh: 150ms 的轻微弹跳位移，短 ease-out，尊重 prefers-reduced-motion
    en: 150ms light bouncy offsets with a short ease-out; honour prefers-reduced-motion
  states:
    zh: hover 错位并加深硬投影；focus 用 2px 黑色可见外框；active 位移贴合投影；disabled 去色不位移；error 用粉红强调
    en: Hover offsets and deepens the hard shadow; focus shows a visible 2px black frame; active shifts flush to the shadow; disabled desaturates without shifting; error uses a pink accent

