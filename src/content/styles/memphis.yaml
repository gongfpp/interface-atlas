playground:
  task:
    zh: "开派对后填写名称、人数、配色生成邀请卡，可修改重新生成；家居、图案、派对、意大利制造各有内容，不发送真实邀请。"
    en: "Start the party, enter a name, guest count and colors and generate an invitation; edit and regenerate it. Homeware, Patterns, Party and Made in Italy reveal content; no invitations are sent."
  checks:
    - zh: "逐一操作 Milano '88 原导航和主 CTA，检查对应内容与返回路径，不只是点击提示。"
      en: "Use Milano '88’s original navigation and primary CTAs; inspect content and return paths, not just click notices."
    - zh: "完成上述 Milano '88 操作后修改输入或撤销，检查结果与状态同步。"
      en: "Complete the Milano '88 task, then change inputs or undo and inspect the matching result/state."
    - zh: "用键盘和 390px / 320px 检查重排、焦点、校验；区分工具栏重载和内部清空，核对刷新后状态复位。"
      en: "Check reflow, focus and validation with keyboard and 390px / 320px viewports; distinguish toolbar reload from in-page clearing and inspect reset-on-reload boundaries."
sources:
  - name: Memphis Milano
    url: https://memphis-milano.com/
  - name: Wikipedia — Memphis Group
    url: https://en.wikipedia.org/wiki/Memphis_Group
implementation:
  css:
    - 'background-image: radial-gradient'
    - 'border: 3px solid #000'
    - 'box-shadow: 5px 5px 0'
    - 'border-radius: 50%'
    - clip-path
  notes:
    zh: 经典配方：黑白几何底纹（波点用 radial-gradient 平铺，条纹用 repeating- linear-gradient）垫底；主体元素用高饱和撞色（柠檬黄 珊瑚红 湖蓝 紫罗兰） + 2～3px 黑描边 + 偏移实心阴影；波浪线与锯齿用 SVG 或 clip-path，数量 控制在 3～5 个防止失控。深色模式把黑底反转成墨蓝，保持撞色饱和度。
    en: 'The classic recipe: a black-and-white geometric ground (dots via tiled radial-gradient, stripes via repeating-linear-gradient); elements in saturated clashes (lemon, coral, lake blue, violet) with 2–3px black outlines and offset solid shadows; squiggles and zigzags as SVG or clip-path, capped at three to five. Dark mode swaps black for ink blue and keeps the saturation.'
prompts:
  basic:
    zh: 用孟菲斯风格（Memphis Design）设计界面：波浪线 圆点 锯齿涂鸦元素与高饱和 撞色，黑色描边与偏移阴影，热闹反秩序的后现代气质。
    en: >-
      "Design an interface in Memphis Design style: squiggles, dots and zigzags in saturated clashing colors with bold
      black outlines and offset shadows — festive, anti-order, postmodern."
  design:
    zh: >-
      孟菲斯设计规范：底面用黑白波点或条纹几何纹样；主体色块用柠檬黄 #FFD53D 珊瑚红 #FF6B6B 湖蓝 #4D96FF 紫罗兰 #B388FF，全部 3px 黑描边加 5px 偏移 实心阴影；点缀波浪线 锯齿与三角 圆
      小方等涂鸦元素 3～5 个；文字粗壮 无衬线可略倾斜；深色模式底改墨蓝 #14143C，撞色保持饱和。
    en: >-
      "Memphis spec: a black-and-white dot or stripe geometric ground; blocks in lemon #FFD53D, coral #FF6B6B, lake blue
      #4D96FF, violet #B388FF with 3px black borders and 5px offset solid shadows; three to five squiggles, zigzags and
      confetti shapes; chunky sans type, slightly tilted OK. Dark mode on ink blue #14143C with saturation kept."
  implementation:
    zh: >-
      以 /styles/memphis/ 为整页入口。标题表达：BREAK THE GRID.；页面气质：用几何、色彩与不规则打破秩序。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title title
      variants" "notes art controls" "notes prompt prompt"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 经典孟菲斯、水磨石、新孟菲斯，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 180ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。
    en: >-
      Build the full /en/styles/memphis/ page. Display direction: BREAK THE GRID.; Colour, geometry and a little
      disorder.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and components.
      Desktop grid areas: "title title variants" "notes art controls" "notes prompt prompt". Do not just recolour a
      template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Classic Memphis, Terrazzo, Neo-Memphis. Update the design and prompt without overwriting manual edits.
      Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching, style
      guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 180ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.
  agent:
    zh: >-
      以 /styles/memphis/ 为整页入口。标题表达：BREAK THE GRID.；页面气质：用几何、色彩与不规则打破秩序。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title title
