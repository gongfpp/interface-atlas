implementation:
  css:
    - 'border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px'
    - 'border: 2px solid #2B2B2B'
    - 'background: linear-gradient() #FFE566 高亮'
    - 'transform: rotate(-1deg)'
    - 'box-shadow: 2px 2px 0 rgba(0,0,0,0.08)'
  notes:
    zh: '抖动边框用非对称 border-radius 四角不同值即可，不必上 SVG filter；要更抖可用 SVG feTurbulence 位移， 但要包进 @media (prefers-reduced-motion: no-preference) 或默认静止。马克笔高亮是一条半透明黄色 background 线性渐变压在文字下 60% 高度。纸纹用低透明度噪点或 repeating-linear-gradient 横线，透明度低于 0.12。 每页倾斜元素 2～4 个即可，多了像没做完。'
    en: 'Fake wobbly borders with asymmetric border-radius values — no SVG filter required. For more tremor use SVG feTurbulence displacement, but keep it static under prefers-reduced-motion. Marker highlight is a translucent yellow linear-gradient band behind the lower 60% of the text. Paper texture is low-opacity noise or repeating horizontal rules under 0.12 opacity. Tilt two to four elements per page; more reads unfinished.'
prompts:
  basic:
    zh: 用手绘涂鸦风格（Hand-drawn UI）设计界面：抖动描边、歪斜圆角、纸张纹理、马克笔高亮，图标像随手勾的。
    en: >-
      Design an interface in Hand-drawn UI style: wobbly outlines, skewed radii, paper texture and marker highlights,
      with icons that read as quick sketches.
  design:
    zh: >-
      手绘涂鸦设计规范：底色纸白 #FAF6EE，墨色 #2B2B2B，高亮黄 #FFE566，点缀珊瑚 #FF8A65； 所有容器非对称圆角（四角不同值）模拟手画；按钮 2px 抖动描边 + 轻微 rotate(-1deg)；
      高亮条压在关键词下；图标用手绘路径或粗描边简笔； 深色模式用牛皮纸深棕底，墨色反成米白，高亮保持。
    en: >-
      "Hand-drawn spec: paper #FAF6EE, ink #2B2B2B, highlight yellow #FFE566, coral accent #FF8A65; every container gets
      asymmetric radii (four different corner values); buttons with 2px wobbly strokes and a slight rotate(-1deg);
      highlighter bars under key words; icons as sketchy paths or thick simple strokes; dark mode on deep kraft brown
      with cream ink, highlight kept."
  implementation:
    zh: >-
      以 /styles/hand-drawn/ 为整页入口。标题表达：PUT IT ON PAPER；页面气质：收集好看的风格，把灵感画在纸上。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title
      prompt" "art prompt" "notes variants" "notes controls"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 马克笔草图、笔记本涂鸦、贴纸乱贴，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 180ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。
    en: >-
      Build the full /en/styles/hand-drawn/ page. Display direction: PUT IT ON PAPER; Collect ideas. Put them on paper..
      Follow the latest whole-page image proposal for layout, typography, artwork, materials and components. Desktop
      grid areas: "title prompt" "art prompt" "notes variants" "notes controls". Do not just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Marker sketch, Notebook doodle, Sticker chaos. Update the design and prompt without overwriting manual
      edits. Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching,
      style guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 180ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.
  agent:
    zh: >-
      以 /styles/hand-drawn/ 为整页入口。标题表达：PUT IT ON PAPER；页面气质：收集好看的风格，把灵感画在纸上。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title
      prompt" "art prompt" "notes variants" "notes controls"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 马克笔草图、笔记本涂鸦、贴纸乱贴，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 180ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。


      先核对设计稿的构图、比例、字体、素材、组件和交互，再修改代码。不要把生成图当成可点击网页或实机截图；素材不含伪按钮与伪文字。验证首页始终可见可点、弹层历史、编辑保留、复制失败、键盘、移动端溢出与减少动态效果。使用
      tests/atlas-pages.spec.mjs 保存真实浏览器截图与操作结果，报告未达成项。
    en: >-
      Build the full /en/styles/hand-drawn/ page. Display direction: PUT IT ON PAPER; Collect ideas. Put them on paper..
      Follow the latest whole-page image proposal for layout, typography, artwork, materials and components. Desktop
      grid areas: "title prompt" "art prompt" "notes variants" "notes controls". Do not just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Marker sketch, Notebook doodle, Sticker chaos. Update the design and prompt without overwriting manual
      edits. Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching,
      style guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 180ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.


      Compare composition, proportions, typography, artwork and interactions before changing code. Never treat a
      generated image as a functional page or runtime screenshot. Verify Home visibility, dialog history, preserved
      edits, clipboard failure, keyboard, narrow layouts and reduced motion. Capture actual screenshots and outcomes
      with tests/atlas-pages.spec.mjs and report remaining gaps.
style_spec:
  typography:
    zh: 手写感无衬线或圆体，标题略歪
    en: Hand-feel sans or rounded face, headings slightly tilted
  color:
    zh: '纸白 #FAF6EE × 墨色 #2B2B2B × 高亮黄 #FFE566'
    en: 'Paper #FAF6EE, ink #2B2B2B, highlight yellow #FFE566'
  border:
    zh: 2px 抖动描边，非对称圆角
    en: 2px wobbly strokes with asymmetric radii
  shadow:
    zh: 极浅纸质投影，几乎贴地
    en: Barely-there paper shadows, hugging the surface
  spacing:
    zh: 随手贴的错位与轻微倾斜
    en: Casual misalignment and slight tilts
  motion:
    zh: 150–250ms 的轻微抖动式位移，带一点回弹，尊重 prefers-reduced-motion
    en: 150–250ms slight wobbly offsets with a hint of bounce; honour prefers-reduced-motion
  states:
    zh: hover 歪斜并加深抖动描边；focus 用 2px 手绘感可见外框；active 压平抖动；disabled 去色保留描边；error 用红笔涂改感
    en: Hover tilts and deepens the wobbly stroke; focus shows a visible 2px hand-drawn frame; active flattens the wobble; disabled desaturates but keeps the stroke; error looks like a red pen correction
