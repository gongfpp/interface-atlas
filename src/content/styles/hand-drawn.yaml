playground:
  task:
    zh: "随手记一笔打开编辑，保存笔记到列表，按关键词过滤并可删除；日记、素材、关于、搜索均有对应内容，显示空白校验、无匹配、删除结果。"
    en: "Make a quick note opens editing. Save notes to the list, filter by keyword and delete entries. Journal, Materials, About and Search reveal content with blank-input validation, no-match and deletion results."
  checks:
    - zh: "逐一操作 scribble& 原导航和主 CTA，检查对应内容与返回路径，不只是点击提示。"
      en: "Use scribble&’s original navigation and primary CTAs; inspect content and return paths, not just click notices."
    - zh: "完成上述 scribble& 操作后修改输入或撤销，检查结果与状态同步。"
      en: "Complete the scribble& task, then change inputs or undo and inspect the matching result/state."
    - zh: "用键盘和 390px / 320px 检查重排、焦点、校验；区分工具栏重载和内部清空，核对刷新后状态复位。"
      en: "Check reflow, focus and validation with keyboard and 390px / 320px viewports; distinguish toolbar reload from in-page clearing and inspect reset-on-reload boundaries."
sources:
  - name: Wikipedia — Doodle
    url: https://en.wikipedia.org/wiki/Doodle
  - name: Wikipedia — Sketch (drawing)
