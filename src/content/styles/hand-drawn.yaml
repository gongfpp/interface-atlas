status: published
name:
  zh: 手绘涂鸦
  en: Hand-drawn UI
aliases:
  - 手绘风
  - 涂鸦风格
  - 手绘描边
  - 歪歪扭扭的线
  - 纸感手写界面
  - hand-drawn UI
  - doodle UI
  - sketchy UI
category:
  - Style
  - Visual Language
description:
  zh: >-
    用抖动线条、歪斜描边、纸张纹理和马克笔高亮表示「人手画的」的界面视觉语言。
    圆故意画不圆，边框带手感抖动，图标像随手勾的。以人的温度对抗机器级完美。
  en: >-
    Wobbly strokes, skewed borders, paper texture and marker highlights as a human-made interface
    look. Circles stay imperfect, outlines tremble, icons read as quick sketches. Human warmth
    against machine-perfect UI.
use_when:
  - zh: 独立创作者、手作品牌、教育类产品，需要亲和与在场感
    en: Independent creators, craft brands and education products needing warmth
  - zh: 空状态、引导气泡、彩蛋等轻量场景，涂鸦当调味
    en: Empty states, coach marks and easter eggs where doodles season the dish
  - zh: 想打破 AI 生成界面的过度光滑与同质
    en: Breaking the over-smooth sameness of AI-generated UI
avoid_when:
  - zh: 金融、法务、医疗等需要精确与权威的界面
    en: Finance, legal and medical UIs that must read precise and authoritative
  - zh: 高密度数据表格与仪表盘，抖动线条干扰数字对齐
    en: Dense tables and dashboards — wobbly lines wreck numeric alignment
  - zh: 长文阅读区，纸纹与高亮叠多了伤阅读
    en: Long reading areas where texture and highlights pile up and hurt
