implementation:
  css:
    - 'border-radius: 999px'
    - 'background: #7B61FF'
    - 'clip-path: ellipse()'
    - 'fill (SVG)'
    - 'no box-shadow'
  notes:
    zh: '插画用 SVG 或纯色块拼装：头是正圆，躯干圆角矩形，四肢是加粗圆头线条（stroke-linecap: round）。 色板锁 3～5 色，肤色用蓝 紫 绿等非写实色表示包容。禁止描边渐变阴影，全部纯色平涂。 UI 部件同源：大圆角胶囊按钮、无边框卡片、留白充足。深色模式换深底但保留同一组高饱和色。'
    en: 'Build illustrations from SVG or solid blocks: circle heads, rounded-rectangle torsos, limbs as thick round-cap strokes. Lock the palette to 3–5 colors; skin is blue, purple or green for abstract inclusivity. No outlines, gradients or shadows — flat fills only. UI follows the same source: pill buttons, borderless cards, airy padding. Dark mode swaps the ground but keeps the same saturated set.'
prompts:
  basic:
    zh: 用企业孟菲斯风格（Corporate Memphis）设计界面：扁平抽象小人、长手长肢、紫黄桃有限色板、圆润色块。
    en: >-
      Design an interface in Corporate Memphis style: flat abstract figures with exaggerated limbs, a limited
      purple-yellow-peach palette and rounded solid shapes.
  design:
    zh: >-
      企业孟菲斯设计规范：主紫 #7B61FF、辅黄 #FAD141、桃粉 #F48196、点缀青 #14C88C，肤色用 #86CCCA 类非写实色； 插画纯平涂无描边无阴影；标题几何无衬线（Poppins / Nunito
      类），中粗即可不要压迫感； 按钮全胶囊，卡片无边框靠底色分区；大留白、插画占 hero 40%～60%； 深色模式深紫黑底，色块饱和度保持。
    en: >-
      "Corporate Memphis spec: primary purple #7B61FF, yellow #FAD141, peach #F48196, teal accent #14C88C, non-realistic
      skin like #86CCCA; illustrations strictly flat with no strokes or shadows; geometric sans (Poppins/Nunito family)
      at medium weight; full-pill buttons and borderless cards separated by fill; airy whitespace with illustration
      taking 40–60% of the hero; dark mode on deep purple-black with saturation kept."
  implementation:
    zh: >-
      以 /styles/corporate-memphis/ 为整页入口。标题表达：BUILD IT TOGETHER；页面气质：好的界面，是一起完成的。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为
      "title title title" "notes art prompt" "notes controls prompt" "notes variants variants"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 经典人形、抽象色块、渐变扁平，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 180ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。
    en: >-
      Build the full /en/styles/corporate-memphis/ page. Display direction: BUILD IT TOGETHER; Good interfaces are built
      together.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and components.
      Desktop grid areas: "title title title" "notes art prompt" "notes controls prompt" "notes variants variants". Do
      not just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Memphis people, Abstract shapes, Gradient flat. Update the design and prompt without overwriting manual
      edits. Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching,
      style guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 180ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.
  agent:
    zh: >-
      以 /styles/corporate-memphis/ 为整页入口。标题表达：BUILD IT TOGETHER；页面气质：好的界面，是一起完成的。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为
      "title title title" "notes art prompt" "notes controls prompt" "notes variants variants"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 经典人形、抽象色块、渐变扁平，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 180ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。


      先核对设计稿的构图、比例、字体、素材、组件和交互，再修改代码。不要把生成图当成可点击网页或实机截图；素材不含伪按钮与伪文字。验证首页始终可见可点、弹层历史、编辑保留、复制失败、键盘、移动端溢出与减少动态效果。使用
      tests/atlas-pages.spec.mjs 保存真实浏览器截图与操作结果，报告未达成项。
    en: >-
      Build the full /en/styles/corporate-memphis/ page. Display direction: BUILD IT TOGETHER; Good interfaces are built
      together.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and components.
      Desktop grid areas: "title title title" "notes art prompt" "notes controls prompt" "notes variants variants". Do
      not just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Memphis people, Abstract shapes, Gradient flat. Update the design and prompt without overwriting manual
      edits. Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching,
      style guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 180ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.


      Compare composition, proportions, typography, artwork and interactions before changing code. Never treat a
      generated image as a functional page or runtime screenshot. Verify Home visibility, dialog history, preserved
      edits, clipboard failure, keyboard, narrow layouts and reduced motion. Capture actual screenshots and outcomes
      with tests/atlas-pages.spec.mjs and report remaining gaps.
style_spec:
  typography:
    zh: 几何无衬线中粗字，宽松行距
    en: Geometric sans at medium weight, airy leading
  color:
    zh: '紫 #7B61FF × 黄 #FAD141 × 桃 #F48196，肤色非写实'
    en: 'Purple #7B61FF, yellow #FAD141, peach #F48196, non-realistic skin'
  border:
    zh: 无描边，色块直接相接
    en: No outlines — fills meet directly
  shadow:
    zh: 无阴影，纯平涂
    en: No shadows, flat fills only
  spacing:
    zh: 大留白，插画与文案左右分栏
    en: Airy padding, illustration and copy in split columns
  motion:
    zh: 150–200ms 的平涂色切换，无位移
    en: 150–200ms flat fill colour swaps, no movement
  states:
    zh: hover 换用相邻色块；focus 用紫色 2px 可见外框；active 换深色平涂；disabled 降不透明；error 用桃粉平涂
    en: Hover switches to an adjacent fill; focus shows a visible 2px violet frame; active uses a darker flat fill; disabled reduces opacity; error uses a peach fill
