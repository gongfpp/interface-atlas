playground:
  task:
    zh: "免费试用进入协作工作区；原首屏日历可操作上一月、下一月和日期，支持跨年切月与选日，初始固定为 2024-01-17。原「任务 5」「笔记 12」入口分别打开真实的 5 项初始任务与 12 条可读取笔记。填写任务和负责人创建所选日期的任务，完成/取消完成同步待办计数、进度及所选日期摘要；新增、读取、删除笔记同步首屏笔记总数。内部重置或刷新均恢复 2024-01-17、5 项待办与 12 条笔记；产品、客户、价格、招聘、登录各有内容，无真实账号或团队邀请。"
    en: "Try it free opens the collaboration workspace. Operate the original hero calendar’s previous/next month and date controls, including year boundaries and date selection; the fixed initial date is 2024-01-17. The original Tasks 5 and Notes 12 entries open five actual seeded tasks and twelve readable notes. Create an owner-assigned task for the selected date; complete/uncomplete tasks to update pending counts, progress and the selected-date summary. Add, read and delete notes with synchronized hero note totals. In-page reset or reload restores 2024-01-17, five pending tasks and twelve notes. Product, Customers, Pricing, Careers and Log in reveal content without real accounts or team invitations."
  checks:
    - zh: "逐一操作 alegria 原导航和主 CTA，检查对应内容与返回路径，不只是点击提示。"
      en: "Use alegria’s original navigation and primary CTAs; inspect content and return paths, not just click notices."
    - zh: "操作原首屏日历跨年切月与选日；从「任务 5」「笔记 12」读取初始内容，新增/完成任务及新增/读取/删除笔记，核对待办数、进度、所选日摘要与笔记总数联动。"
      en: "Use the original hero calendar across year boundaries and select a date; open Tasks 5 and Notes 12 to read seeded content, add/complete tasks and add/read/delete notes, checking pending counts, progress, date summary and note totals together."
    - zh: "用键盘和 390px / 320px 检查重排、焦点与校验；分别执行内部重置和整页重载，确认恢复 2024-01-17、5 项待办与 12 条笔记，且不持久保存操作。"
      en: "Check reflow, focus and validation with keyboard and 390px / 320px viewports; test in-page reset and document reload separately, confirming restoration of 2024-01-17, five pending tasks and twelve notes without persistent state."
