status: published
name:
  zh: 企业孟菲斯
  en: Corporate Memphis
aliases:
  - 企业孟菲斯
  - 大厂插画风
  - 蓝色小人插画
  - 长手长脚扁平小人
  - 科技公司插画风
  - Alegria
  - Big Tech illustration
  - flat blob people
category:
  - Style
  - Visual Language
description:
  zh: >-
    用扁平抽象人形与受限纯色表示「友好大厂」的插画视觉语言：小头长肢、无面部细节、
    紫黄桃等有限色板，圆润色块构图。生产成本低、人人可画，也因此高度同质。
  en: >-
    Flat abstract human figures and a limited solid palette as the friendly big-tech illustration
    look: small heads, exaggerated limbs, no facial detail, purple-yellow-peach blocks in rounded
    compositions. Cheap to mass-produce — and therefore highly homogenous.
use_when:
  - zh: SaaS、工具类产品的空状态、引导页、营销插画，需要无攻击性的友好感
    en: SaaS empty states, onboarding and marketing spots that need non-threatening friendliness
  - zh: 多人多地协作维护插画系统，要求画风可复制
    en: Illustration systems produced by many hands that must stay consistent
  - zh: 要传达包容、协作、普惠的抽象价值观
    en: Abstract values of inclusion, collaboration and access
avoid_when:
  - zh: 品牌需要独特记忆点，同质化插画会让产品淹没在大厂语汇里
    en: Brands that need distinction — this look drowns you in big-tech sameness
  - zh: 高端、奢侈、手作、严肃议题，扁平小人撑不起重量
    en: Premium, craft or serious subjects that flat figures cannot carry
  - zh: 用插画传达具体产品功能，抽象人形说不清细节
    en: Explaining concrete product mechanics — abstract figures cannot
