playground:
  task:
    zh: "探索项目进入精选作品；打开 NORTH / OPEN / FORM 案例并返回；菜单到达 WORK / STUDIO / APPROACH / CONTACT。联系表单校验姓名、邮箱、简介并显示可继续修改的整理结果，不发送邮件；语言入口切换中英文同款页。"
    en: "Explore work opens selected projects; inspect NORTH / OPEN / FORM and return. The menu reaches WORK / STUDIO / APPROACH / CONTACT. Validate name, email and brief and show an editable local summary without sending email; the language control opens the translated page."
  checks:
    - zh: "逐一操作 VERTEX 原导航和主 CTA，检查对应内容与返回路径，不只是点击提示。"
      en: "Use VERTEX’s original navigation and primary CTAs; inspect content and return paths, not just click notices."
    - zh: "完成上述 VERTEX 操作后修改输入或撤销，检查结果与状态同步。"
      en: "Complete the VERTEX task, then change inputs or undo and inspect the matching result/state."
    - zh: "用键盘和 390px / 320px 检查重排、焦点、校验；区分工具栏重载和内部清空，核对刷新后状态复位。"
      en: "Check reflow, focus and validation with keyboard and 390px / 320px viewports; distinguish toolbar reload from in-page clearing and inspect reset-on-reload boundaries."
sources:
  - name: Wikipedia — International Typographic Style
