implementation:
  css:
    - grid
    - 'font-family: Helvetica'
    - 'text-align: left'
    - letter-spacing
    - 'border-top: 2px solid'
  notes:
    zh: 先立网格：12 列或简单 3×3，所有元素吸附网格线，禁止任意间距。字体只用 一套无衬线（Helvetica/Inter/Neue Haas），层级靠字号跳跃（如 12/48px） 而非加粗渐变；正文左对齐，禁用居中排版。色彩为黑 白 灰 + 单一强调红， 红只出现在标题标号与关键线上。分隔用粗细两种横线（2px/1px）。
    en: 'Grid first: a 12-column or simple 3×3 grid that every element snaps to — no arbitrary spacing. One sans family (Helvetica/Inter/Neue Haas); hierarchy from size jumps (e.g. 12/48px), not weight ramps; flush-left text, centered setting banned. Black, white, grey plus a single red that only marks indices and key rules. Separate with two rule weights (2px/1px).'
prompts:
  basic:
    zh: 用瑞士风格（Swiss Style）设计界面：严格网格排版、无衬线字体、左对齐、 黑白加单色强调红，层级靠字号对比与留白建立。
    en: >-
      "Design an interface in Swiss Style: strict grid typography, sans-serif, flush-left, black-and-white with a single
      red accent, hierarchy from scale contrast and whitespace."
  design:
    zh: >-
      瑞士风格设计规范：白色底 黑色 Helvetica（或 Inter）；建立 12 列网格并 让所有元素对齐；标题字号与正文形成 4 倍以上跳跃；强调色仅用一个红色 #E30613，用于标号与粗横线；留白宽松且成模数（8
      的倍数）；无阴影 无 渐变 无圆角（或极小圆角）；深色模式为近黑底 反白字 红色保留。
    en: >-
      "Swiss style spec: white ground, black Helvetica (or Inter); a 12-column grid everything aligns to; headings at
      4x+ body size; one red #E30613 for indices and heavy rules only; generous modular whitespace (multiples of 8); no
      shadows, gradients or big radii. Dark mode: near-black ground, inverted text, red retained."
  implementation:
    zh: >-
      以 /styles/swiss-style/ 为整页入口。标题表达：ORDNUNG / 02；页面气质：让秩序成为视觉语言。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title title
      variants" "art notes controls" "prompt prompt prompt"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 苏黎世学派、巴塞尔学派、新瑞士，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 80ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。
    en: >-
      Build the full /en/styles/swiss-style/ page. Display direction: ORDNUNG / 02; Order is a visual language.. Follow
      the latest whole-page image proposal for layout, typography, artwork, materials and components. Desktop grid
      areas: "title title variants" "art notes controls" "prompt prompt prompt". Do not just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Zurich School, Basel School, New Swiss. Update the design and prompt without overwriting manual edits.
      Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching, style
      guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 80ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.
  agent:
    zh: >-
      以 /styles/swiss-style/ 为整页入口。标题表达：ORDNUNG / 02；页面气质：让秩序成为视觉语言。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title title
      variants" "art notes controls" "prompt prompt prompt"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 苏黎世学派、巴塞尔学派、新瑞士，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 80ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。


      先核对设计稿的构图、比例、字体、素材、组件和交互，再修改代码。不要把生成图当成可点击网页或实机截图；素材不含伪按钮与伪文字。验证首页始终可见可点、弹层历史、编辑保留、复制失败、键盘、移动端溢出与减少动态效果。使用
      tests/atlas-pages.spec.mjs 保存真实浏览器截图与操作结果，报告未达成项。
    en: >-
      Build the full /en/styles/swiss-style/ page. Display direction: ORDNUNG / 02; Order is a visual language.. Follow
      the latest whole-page image proposal for layout, typography, artwork, materials and components. Desktop grid
      areas: "title title variants" "art notes controls" "prompt prompt prompt". Do not just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Zurich School, Basel School, New Swiss. Update the design and prompt without overwriting manual edits.
      Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching, style
      guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 80ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.


      Compare composition, proportions, typography, artwork and interactions before changing code. Never treat a
      generated image as a functional page or runtime screenshot. Verify Home visibility, dialog history, preserved
      edits, clipboard failure, keyboard, narrow layouts and reduced motion. Capture actual screenshots and outcomes
      with tests/atlas-pages.spec.mjs and report remaining gaps.
style_spec:
  typography:
    zh: Helvetica 式无衬线，全大写粗黑标题
    en: Helvetica-style sans; bold uppercase headlines
  color:
    zh: '纸灰底 × 纯黑 × 正红 #E63312'
    en: 'Paper grey, pure black, signal red #E63312'
  border:
    zh: 1px 黑色实线分割栏
    en: 1px solid black column rules
  shadow:
    zh: 无阴影，扁平到极致
    en: Zero shadows — strictly flat
  spacing:
    zh: 严格网格，栏距一致
    en: Strict modular grid, consistent gutters
  motion:
    zh: 近似瞬时，颜色切换在 100ms 内，无缓动位移
    en: Near-instant colour swaps within 100ms, no eased movement
  states:
    zh: hover 改用正红或反白；focus 用 2px 黑色可见实线框；active 反色块；disabled 降为灰；error 用正红并加粗
    en: Hover switches to signal red or knock-out white; focus shows a visible 2px black solid frame; active inverts the block; disabled drops to grey; error uses signal red at a heavier weight

