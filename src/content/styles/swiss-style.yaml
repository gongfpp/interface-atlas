status: published
name:
  zh: 瑞士风格
  en: Swiss Style
aliases:
  - 瑞士风格
  - 瑞士平面设计
  - 国际主义排版风格
  - 网格排版风格
  - 黑白红海报风
  - Helvetica风格
  - International Typographic Style
  - Swiss Design
category:
  - Style
  - Visual Language
description:
  zh: 以客观网格与排版传达信息的视觉语言：严密的数学网格、无衬线字体、左对齐、 黑白加一个强调色（经典为红），用留白与字号对比建立秩序。装饰被视为噪音， 设计的目标是让信息以最短的路径被读懂。
  en: 'A visual language of objective grids and typography: strict mathematical grids, sans-serif faces, flush-left setting, black and white plus one accent (classically red). Order comes from whitespace and type scale. Decoration is noise; the goal is information read along the shortest path.'
use_when:
  - zh: 设计系统 博物馆 文化机构，需要客观严谨的秩序感
    en: Design systems, museums and institutions that need objective rigor
  - zh: 数据 技术文档 目录类内容，结构化信息为主
    en: Data, documentation and catalog content that is inherently structured
  - zh: 海报 期刊封面等需要强烈排版张力的场景
    en: Posters and covers that thrive on typographic tension
avoid_when:
  - zh: 品牌需要亲和 温暖或娱乐化的情绪
    en: Brands needing warmth, approachability or playfulness
  - zh: 内容零散无结构，网格反而放大凌乱感
    en: Unstructured content — a strict grid only amplifies the mess
  - zh: 中文与衬线混排为主的阅读场景，风格语言不匹配
    en: Reading contexts dominated by CJK and serif mixes — the idiom misfits
tags:
