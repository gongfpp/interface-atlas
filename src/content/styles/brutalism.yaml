confusable:
  - id: neobrutalism
    note:
      zh: 粗野主义是原始未修饰的网页，黑白为主；新粗野主义是糖果贴纸加粗黑边与硬阴影，色彩喧闹。
      en: Brutalism is raw, unstyled web in monochrome; neobrutalism is candy stickers with thick borders and hard shadows.
