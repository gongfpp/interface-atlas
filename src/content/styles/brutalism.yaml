playground:
  task:
    zh: "查看作品进入项目目录，打开项目内容并返回；WORK / ABOUT / NEWS / CONTACT 均有对应内容；联系表单校验后显示本地整理结果，不发送邮件。"
    en: "View our work opens the project index; inspect a project and return. WORK / ABOUT / NEWS / CONTACT reveal matching content; the contact form validates and shows a local summary without sending email."
  checks:
    - zh: "逐一操作 STUDIO VOID 原导航和主 CTA，检查对应内容与返回路径，不只是点击提示。"
      en: "Use STUDIO VOID’s original navigation and primary CTAs; inspect content and return paths, not just click notices."
    - zh: "完成上述 STUDIO VOID 操作后修改输入或撤销，检查结果与状态同步。"
      en: "Complete the STUDIO VOID task, then change inputs or undo and inspect the matching result/state."
    - zh: "用键盘和 390px / 320px 检查重排、焦点、校验；区分工具栏重载和内部清空，核对刷新后状态复位。"
      en: "Check reflow, focus and validation with keyboard and 390px / 320px viewports; distinguish toolbar reload from in-page clearing and inspect reset-on-reload boundaries."
sources:
  - name: Wikipedia — Brutalist architecture
    url: https://en.wikipedia.org/wiki/Brutalist_architecture
  - name: NN/g — Brutalism and Antidesign
    url: https://www.nngroup.com/articles/brutalism-antidesign
implementation:
  css:
    - 'font-size: clamp(2.5rem, 8vw, 6rem)'
    - 'border-radius: 0'
    - 'border: 2px solid currentColor'
    - 'background-image: repeating-linear-gradient()'
    - 'font-family: system-ui, monospace'
  notes:
    zh: '命门是「不修边幅」：圆角一律 0，阴影不用或只用硬边框替代，字体走系统栈或等宽体。 背景网格用 repeating-linear-gradient 画出来即可，不必真开 CSS Grid。强调色只留一个 （常见刺眼橙红 #FF3B00），其余全黑白。深色模式反转明度关系但保持同样的硬切。 不要为了「像」粗野而降低文字对比度或打乱阅读顺序。'
    en: 'The point is unpolish: radii stay 0, shadows are replaced by hard borders, type is system or monospace. A repeating-linear-gradient fakes the visible grid — no need for real CSS Grid. Keep exactly one harsh accent (classically #FF3B00); everything else is black and white. Dark mode inverts the value relationship but keeps the same blunt cuts. Never lower text contrast or scramble reading order just to look brutalist.'
prompts:
  basic:
    zh: 用粗野主义风格（Brutalism）设计界面：黑白硬切、超大字号、可见网格、直角硬边，单一刺眼强调色，反精致。
    en: >-
      Design an interface in Brutalism style: monochrome cuts, oversized type, visible grid, hard square edges and one
      harsh accent — deliberately anti-polish.
  design:
    zh: >-
      粗野主义设计规范：底色纸白 #F5F5F0 或近黑；正文纯黑 #0A0A0A；强调色只用一个刺眼橙红 #FF3B00； 全部圆角 0；标题字号 clamp(2.5rem, 8vw, 6rem)，超粗无衬线或等宽；网格线 1px
      实线可见； 按钮用 2px 实线框或纯色块反白，hover 反色即可不做位移；深色模式用近黑底配纸白字，强调色不变。
    en: >-
      "Brutalism spec: paper white #F5F5F0 or near-black ground; pure black #0A0A0A body; exactly one harsh accent
      #FF3B00; zero radii everywhere; headings at clamp(2.5rem, 8vw, 6rem) in ultra-bold sans or mono; 1px visible grid
      rules; buttons as 2px outline or solid inverted blocks, hover just inverts colors; dark mode flips to near-black
      with paper-white type, accent unchanged."
  implementation:
    zh: >-
      以 /styles/brutalism/ 为整页入口。标题表达：THIS IS THE INTERFACE.；页面气质：结构裸露，表达直接。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title
      title" "notes variants" "art controls" "prompt prompt"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 经典粗野、软粗野、排印粗野，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 0ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。
    en: >-
      Build the full /en/styles/brutalism/ page. Display direction: THIS IS THE INTERFACE.; Raw structure. Direct
      expression.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and
      components. Desktop grid areas: "title title" "notes variants" "art controls" "prompt prompt". Do not just
      recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Classic brutalism, Soft brutalism, Typographic brutalism. Update the design and prompt without
      overwriting manual edits. Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves,
      locale switching, style guide and editable prompts; select text for manual copy when clipboard access fails. Base
      transition: 0ms, disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.
  agent:
    zh: >-
      以 /styles/brutalism/ 为整页入口。标题表达：THIS IS THE INTERFACE.；页面气质：结构裸露，表达直接。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title
      title" "notes variants" "art controls" "prompt prompt"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 经典粗野、软粗野、排印粗野，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 0ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。


      先核对设计稿的构图、比例、字体、素材、组件和交互，再修改代码。不要把生成图当成可点击网页或实机截图；素材不含伪按钮与伪文字。验证首页始终可见可点、弹层历史、编辑保留、复制失败、键盘、移动端溢出与减少动态效果。使用
      tests/atlas-pages.spec.mjs 保存真实浏览器截图与操作结果，报告未达成项。
    en: >-
      Build the full /en/styles/brutalism/ page. Display direction: THIS IS THE INTERFACE.; Raw structure. Direct
      expression.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and
      components. Desktop grid areas: "title title" "notes variants" "art controls" "prompt prompt". Do not just
      recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Classic brutalism, Soft brutalism, Typographic brutalism. Update the design and prompt without
      overwriting manual edits. Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves,
      locale switching, style guide and editable prompts; select text for manual copy when clipboard access fails. Base
      transition: 0ms, disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.


      Compare composition, proportions, typography, artwork and interactions before changing code. Never treat a
      generated image as a functional page or runtime screenshot. Verify Home visibility, dialog history, preserved
      edits, clipboard failure, keyboard, narrow layouts and reduced motion. Capture actual screenshots and outcomes
      with tests/atlas-pages.spec.mjs and report remaining gaps.
style_spec:
  typography:
    zh: 超粗无衬线或等宽体，字号断崖式对比
    en: Ultra-bold sans or mono with cliff-edge size contrast
  color:
    zh: '纸白 × 纯黑 × 单一刺眼橙红 #FF3B00'
    en: 'Paper white, pure black and one harsh orange-red #FF3B00'
  border:
    zh: 2px 实线直角硬边，圆角一律 0
    en: 2px solid square edges, radius always 0
  shadow:
    zh: 不用投影，需要层级时用反色块或粗描边
    en: No shadows; inverted blocks or thick strokes instead
  spacing:
    zh: 紧贴网格线的硬切排布，留白大开大合
    en: Hard cuts on the grid, whitespace in big blunt blocks
  motion:
    zh: 近似瞬时，无过渡
    en: Near-instant, no transition
  states:
    zh: 'hover 直接反色；focus 用 2px 黑色实线粗框；active 换成刺眼橙红 #FF3B00；disabled 降为 50% 灰；error 用 #FF3B00 实色块'
    en: 'Hover inverts immediately; focus shows a 2px solid black frame; active switches to harsh orange-red #FF3B00; disabled drops to 50% grey; error uses a solid #FF3B00 block'
