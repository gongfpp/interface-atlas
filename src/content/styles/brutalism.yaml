status: published
name:
  zh: 粗野主义
  en: Brutalism
aliases:
  - 粗野主义
  - 野兽派网页
  - 那种很糙的黑白网页
  - 超大字不修边幅
  - 原始网页风
  - brutalism
  - web brutalism
  - brutalist web design
category:
  - Style
  - Visual Language
description:
  zh: >-
    用裸露的结构、超大字号和原始对比色强调「反精致」的网页视觉语言。黑白硬切、可见网格、
    直角硬边，保留默认 HTML 的诚实感；信息直接砸向读者，拒绝圆角、渐变与装饰性打磨。
  en: >-
    Raw structure, oversized type and blunt contrast as an anti-polish web look. Monochrome cuts,
    visible grids and hard square edges keep the honesty of default HTML. Information hits the
    reader straight on; radii, gradients and decorative refinement are refused.
use_when:
  - zh: 设计师作品集、独立出版、艺术机构官网，态度本身就是内容
    en: Designer portfolios, indie publishing and art institutions where attitude is the content
  - zh: 想在同质化的精致界面里用「不修边幅」制造强烈记忆点
    en: Standing out among polished sites through deliberate unpolish
  - zh: 低密度宣言页、活动页，超大字当海报使
    en: Low-density manifesto or campaign pages where type is the poster
avoid_when:
  - zh: 金融、医疗、政务等需要稳重可信的操作型产品
    en: Finance, healthcare and civic tools that must feel trustworthy
  - zh: 长表单与高密度数据后台，硬切对比会加剧阅读疲劳
    en: Long forms and dense data backends — blunt contrast fatigues reading
  - zh: 需要传达精细、高端、呵护感的品牌叙事
    en: Brands that must feel refined, premium or caring
tags:
  - brutalism
  - anti-design
  - typography
  - monochrome
  - raw
variants:
  - id: classic
    name:
      zh: 经典粗野
      en: Classic brutalism
    note:
      zh: 黑白灰硬切加单一刺眼强调色，保留默认浏览器气质
      en: Monochrome cuts with one harsh accent, default-browser honesty kept
  - id: soft-brutalism
    name:
      zh: 软粗野
      en: Soft brutalism
    note:
      zh: 保留原始对比与超大字，但放宽圆角与留白
      en: Raw contrast and oversized type kept, radii and whitespace loosened
  - id: typographic
    name:
      zh: 排印粗野
      en: Typographic brutalism
    note:
      zh: 字号、字重、行距承担全部表现力，几乎不用图形
      en: Size, weight and leading carry everything — almost no graphics
