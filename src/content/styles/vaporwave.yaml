playground:
  task:
    zh: "步入中庭进入楼层导览，选楼层查看音像、美食等场所，护照打卡且重复不计数；音像、美食广场、关于可返回对应导览，无真实消费。"
    en: "Enter the atrium opens the floor guide. Choose floors for media and food venues; stamp a passport without counting duplicates. Media, Food court and About return to the matching guide; there are no real purchases."
  checks:
    - zh: "逐一操作 MALL★95 原导航和主 CTA，检查对应内容与返回路径，不只是点击提示。"
      en: "Use MALL★95’s original navigation and primary CTAs; inspect content and return paths, not just click notices."
    - zh: "完成上述 MALL★95 操作后修改输入或撤销，检查结果与状态同步。"
      en: "Complete the MALL★95 task, then change inputs or undo and inspect the matching result/state."
    - zh: "用键盘和 390px / 320px 检查重排、焦点、校验；区分工具栏重载和内部清空，核对刷新后状态复位。"
      en: "Check reflow, focus and validation with keyboard and 390px / 320px viewports; distinguish toolbar reload from in-page clearing and inspect reset-on-reload boundaries."
sources:
  - name: Wikipedia — Vaporwave
    url: https://en.wikipedia.org/wiki/Vaporwave
  - name: Wikipedia — Synthwave
    url: https://en.wikipedia.org/wiki/Synthwave
implementation:
  css:
    - 'linear-gradient 粉紫青'
    - 'perspective + rotateX 网格地平线'
    - 'background-clip: text 镀铬字'
    - 'text-shadow 多层霓虹'
    - 'repeating-linear-gradient 扫描线'
  notes:
    zh: '地平线网格是招牌：一个 perspective 容器里放 rotateX(70deg) 的 repeating-linear-gradient 网格 平面，底部渐隐。镀铬字用多段灰阶或粉青渐变 + background-clip: text + 深色描边。 霓虹用 text-shadow 多层同色扩散，色相锁粉 #FF71CE 青 #01CDFE 紫 #B967FF。棕榈树与希腊柱当剪影贴 1～2 处。故障动画短促低频，尊重 prefers-reduced-motion。'
    en: 'The grid horizon is the signature: a perspective container holding a rotateX(70deg) repeating-linear-gradient plane, faded at the bottom. Chrome type is a multi-stop grey or pink-cyan gradient via background-clip: text with a dark outline. Neon is multi-layer same-hue text-shadow; lock the hue set to pink #FF71CE, cyan #01CDFE, violet #B967FF. Palm and column silhouettes as one or two stickers. Glitch stays brief and rare, respecting prefers-reduced-motion.'
prompts:
  basic:
    zh: 用蒸汽波风格（Vaporwave）设计界面：霓虹粉紫青、透视网格地平线、镀铬 3D 字、棕榈树剪影与轻故障。
    en: >-
      Design an interface in Vaporwave style: neon pink-cyan-purple, a perspective grid horizon, retro 3D chrome type,
      palm silhouettes and light glitch.
  design:
    zh: >-
      蒸汽波设计规范：底色深紫粉渐变（#2B0F54 → #FF71CE 边缘）；网格地平线青 #01CDFE； 标题镀铬字（银灰多段或粉青渐变 background-clip: text）；按钮粉青描边胶囊 + 霓虹外发光；
      棕榈树/罗马柱剪影点缀 1～2 处；扫描线 opacity ≤ 0.06； 深色模式本来就是主模式，浅色版只用于「商场软调」变体。
    en: >-
      "Vaporwave spec: deep purple-pink gradient ground (#2B0F54 → #FF71CE at the edges); cyan #01CDFE grid horizon;
      chrome headings (multi-stop silver or pink-cyan via background-clip: text); pill buttons with pink-cyan strokes
      and neon glow; one or two palm/column silhouettes; scanline overlay at opacity ≤ 0.06; dark is the native mode — a
      light ground only appears in the mall-soft variant."
  implementation:
    zh: >-
      以 /styles/vaporwave/ 为整页入口。标题表达：THE MALL OF MEMORY；页面气质：记忆的商场，永不打烊。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "notes title
      title" "notes art art" "prompt art art" "prompt controls variants"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 商场软调、霓虹故障、全息镀铬，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 320ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。
    en: >-
      Build the full /en/styles/vaporwave/ page. Display direction: THE MALL OF MEMORY; The mall of memory never
      closes.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and components.
      Desktop grid areas: "notes title title" "notes art art" "prompt art art" "prompt controls variants". Do not just
      recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Mall soft, Neon glitch, Holographic chrome. Update the design and prompt without overwriting manual
      edits. Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching,
      style guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 320ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.
  agent:
    zh: >-
      以 /styles/vaporwave/ 为整页入口。标题表达：THE MALL OF MEMORY；页面气质：记忆的商场，永不打烊。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "notes title
      title" "notes art art" "prompt art art" "prompt controls variants"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 商场软调、霓虹故障、全息镀铬，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 320ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。


      先核对设计稿的构图、比例、字体、素材、组件和交互，再修改代码。不要把生成图当成可点击网页或实机截图；素材不含伪按钮与伪文字。验证首页始终可见可点、弹层历史、编辑保留、复制失败、键盘、移动端溢出与减少动态效果。使用
      tests/atlas-pages.spec.mjs 保存真实浏览器截图与操作结果，报告未达成项。
    en: >-
      Build the full /en/styles/vaporwave/ page. Display direction: THE MALL OF MEMORY; The mall of memory never
      closes.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and components.
      Desktop grid areas: "notes title title" "notes art art" "prompt art art" "prompt controls variants". Do not just
      recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Mall soft, Neon glitch, Holographic chrome. Update the design and prompt without overwriting manual
      edits. Native dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching,
      style guide and editable prompts; select text for manual copy when clipboard access fails. Base transition: 320ms,
      disabled with reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.


      Compare composition, proportions, typography, artwork and interactions before changing code. Never treat a
      generated image as a functional page or runtime screenshot. Verify Home visibility, dialog history, preserved
      edits, clipboard failure, keyboard, narrow layouts and reduced motion. Capture actual screenshots and outcomes
      with tests/atlas-pages.spec.mjs and report remaining gaps.
style_spec:
  typography:
    zh: 镀铬渐变展示字 + 宽字距无衬线
    en: Chrome-gradient display type plus wide-tracked sans
  color:
    zh: '粉 #FF71CE × 青 #01CDFE × 紫 #B967FF'
    en: 'Pink #FF71CE, cyan #01CDFE, violet #B967FF'
  border:
    zh: 1px 霓虹描边，胶囊与直角混用
    en: 1px neon rims, pills and hard corners mixed
  shadow:
    zh: 多层同色霓虹光晕
    en: Multi-layer same-hue neon glows
  spacing:
    zh: 地平线居中对称，元素悬浮网格上
    en: Centered symmetric horizon, elements floating over the grid
  motion:
    zh: 300–400ms 的霓虹渐亮与地平线滑动，尊重 prefers-reduced-motion
    en: 300–400ms neon warm-up and horizon glide; honour prefers-reduced-motion
  states:
    zh: hover 增强多层霓虹光晕；focus 用青色可见亮环；active 压低饱和；disabled 去光降透明；error 用粉红霓虹
    en: Hover strengthens the layered neon glow; focus shows a visible cyan ring; active lowers saturation; disabled loses glow and opacity; error uses pink neon
