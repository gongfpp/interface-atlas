status: published
name:
  zh: 蒸汽波
  en: Vaporwave
aliases:
  - 蒸汽波
  - 蒸汽波风格
  - 粉紫蓝复古未来
  - 霓虹网格地平线
  - 80年代商场美学
  - vaporwave
  - synthwave UI
  - retro mall aesthetic
category:
  - Style
  - Visual Language
description:
  zh: >-
    用霓虹粉紫青、透视网格地平线、镀铬 3D 字与棕榈树剪影表示「消费主义怀旧」的视觉语言。
    拼贴 80-90 年代商场、早期 CGI 与故障信号，甜腻、迷幻、又带着空洞的乐观。
  en: >-
    Neon pink-cyan-purple, a perspective grid horizon, retro 3D chrome type and palm silhouettes as
    consumer-nostalgia look. It collages 80s-90s mall culture, early CGI and signal glitch — sweet,
    hazy, hollowly optimistic.
use_when:
  - zh: 音乐、夜店、潮牌、复古主题活动，风格即情绪
    en: Music, club, streetwear and retro events where style is the mood
  - zh: 需要强烈亚文化信号与迷幻氛围的营销页
    en: Campaign pages that must signal subculture and haze
  - zh: 播放器、票券、虚拟商品等娱乐向界面
    en: Players, tickets and virtual goods in entertainment contexts
avoid_when:
  - zh: 金融、医疗、政务等需要冷静可信的界面
    en: Finance, healthcare and civic UIs that must stay calm and trustworthy
  - zh: 长文阅读与表单录入，霓虹与闪烁持续消耗注意力
    en: Long reading and form entry — neon and flicker drain attention
  - zh: 无障碍要求高的场景，粉紫青对比度与闪烁都有风险
    en: Accessibility-critical contexts — pink-purple contrast and flicker are risky
