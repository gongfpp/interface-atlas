playground:
  task:
    zh: "捏一下进入黏土小屋，选择颜色、反复捏压并同步计数和角色结果，可收藏到小屋；主页、小屋、商店、小熊入口均有内容，不真实购买。"
    en: "Give it a squeeze opens the clay cabin. Pick a color, squeeze repeatedly and update counter and character together, then save to the cabin. Home, Cabin, Shop and the bear entry reveal content without real purchases."
  checks:
    - zh: "逐一操作 Claymates 原导航和主 CTA，检查对应内容与返回路径，不只是点击提示。"
      en: "Use Claymates’s original navigation and primary CTAs; inspect content and return paths, not just click notices."
    - zh: "完成上述 Claymates 操作后修改输入或撤销，检查结果与状态同步。"
      en: "Complete the Claymates task, then change inputs or undo and inspect the matching result/state."
    - zh: "用键盘和 390px / 320px 检查重排、焦点、校验；区分工具栏重载和内部清空，核对刷新后状态复位。"
      en: "Check reflow, focus and validation with keyboard and 390px / 320px viewports; distinguish toolbar reload from in-page clearing and inspect reset-on-reload boundaries."
sources:
  - name: Hype4 Academy — Claymorphism in design
    url: https://www.hype4.academy/articles/design/claymorphism-in-web-design
  - name: MDN — box-shadow
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/box-shadow
implementation:
  css:
    - 'border-radius: 20px'
    - 'box-shadow: inset 0 -6px 12px'
    - 'box-shadow: 0 12px 24px'
    - pastel
  notes:
    zh: 膨胀公式 = 大圆角（20～32px）+ 三重阴影：外侧大模糊同色系投影（如 0 14px 28px 主色 35%）、内侧下压暗影（inset 0 -8px 16px）、内侧顶部 高光（inset 0 3px 6px 白）。底色与投影必须同色系，投影带色而不发灰。 按下时缩小外投影并加强内凹，形成"捏下去"的反馈。深色黏土用深灰底 加更深一号的同色投影。
    en: 'Inflation formula = big radii (20–32px) plus three shadows: a large blurred same-hue drop (e.g. 0 14px 28px at 35% of the base color), an inner bottom press (inset 0 -8px 16px), and an inner top light (inset 0 3px 6px white). Tinted shadows must stay in-family — never grey. On press, shrink the drop and deepen the inner shadow to feel squeezed. Dark clay uses deep grey with a darker same-hue drop.'
prompts:
  basic:
    zh: 用黏土风（Claymorphism）设计界面：大圆角粉彩元素，外膨胀投影 + 内凹 阴影的双重质感，控件像充气的软黏土块。
    en: >-
      "Design an interface in Claymorphism style: big-radius pastel elements with an inflated outer drop plus an inner
      concave shadow — controls like puffed clay."
  design:
    zh: >-
      黏土风设计规范：底色粉彩（#EAF0FF 等浅底或淡粉 淡绿 淡紫）；主色 #6C8CFF 类柔和饱和色；卡片圆角 24px，阴影三重：0 14px 28px 主色 35%、 inset 0 -8px 16px 主色
      30%、inset 0 3px 6px 白 70%；按钮按压时外投影 收缩 内凹加强；文字近黑保证对比；深色模式用深灰底 #23252E 加深一号 同色投影。
    en: >-
      "Claymorphism spec: pastel grounds (#EAF0FF or soft pink/green/lilac); gentle saturated primary like #6C8CFF;
      cards at 24px radii with triple shadows — 0 14px 28px primary 35%, inset 0 -8px 16px primary 30%, inset 0 3px 6px
      white 70%; pressed buttons shrink the drop and deepen the concave; near-black text for contrast. Dark mode: deep
      grey #23252E with a darker same-hue drop."
  implementation:
    zh: >-
      以 /styles/claymorphism/ 为整页入口。标题表达：SQUISH YOUR IDEAS；页面气质：像捏一团想象力。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title art"
      "variants art" "controls prompt" "notes notes"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 软黏土、糖果黏土、深色黏土，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 220ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。
    en: >-
      Build the full /en/styles/claymorphism/ page. Display direction: SQUISH YOUR IDEAS; Give your imagination a softer
      shape.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and components.
      Desktop grid areas: "title art" "variants art" "controls prompt" "notes notes". Do not just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Soft Clay, Candy Clay, Dark Clay. Update the design and prompt without overwriting manual edits. Native
      dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching, style guide and
      editable prompts; select text for manual copy when clipboard access fails. Base transition: 220ms, disabled with
      reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.
  agent:
    zh: >-
      以 /styles/claymorphism/ 为整页入口。标题表达：SQUISH YOUR IDEAS；页面气质：像捏一团想象力。。按最新整页图像提案设计布局、字体、图形、材质与组件；桌面区域构图为 "title art"
      "variants art" "controls prompt" "notes notes"，不能只换颜色。


      首页入口固定在左上角，图标加“首页”，点击区域至少 44×44px；手机上不收进菜单。变体只使用 软黏土、糖果黏土、深色黏土，切换同步材质、构图或控件与提示词；保留用户已编辑文字。详情通过原生 dialog 打开，支持
      Escape、焦点归还和浏览器前进后退。保留收藏、语言切换、风格指南与可编辑提示词；复制失败选中文本供手动复制。当前风格过渡基准 220ms，减少动态效果时取消动画。桌面、390px、320px 按内容重排。


      实现入口为 src/components/atlas/AtlasPage.astro；逐风格顺序在 src/lib/atlas-designs.ts；交互在 src/lib/atlas-runtime.ts；整页样式在
      src/styles/atlas-pages.css。既有 /style-scenes/ 独立案例保留，但不要重新嵌入详情页。


      先核对设计稿的构图、比例、字体、素材、组件和交互，再修改代码。不要把生成图当成可点击网页或实机截图；素材不含伪按钮与伪文字。验证首页始终可见可点、弹层历史、编辑保留、复制失败、键盘、移动端溢出与减少动态效果。使用
      tests/atlas-pages.spec.mjs 保存真实浏览器截图与操作结果，报告未达成项。
    en: >-
      Build the full /en/styles/claymorphism/ page. Display direction: SQUISH YOUR IDEAS; Give your imagination a softer
      shape.. Follow the latest whole-page image proposal for layout, typography, artwork, materials and components.
      Desktop grid areas: "title art" "variants art" "controls prompt" "notes notes". Do not just recolour a template.


      Keep an icon plus Home link fixed at the top left, at least 44×44px, visible on mobile without opening a menu.
      Variants: Soft Clay, Candy Clay, Dark Clay. Update the design and prompt without overwriting manual edits. Native
      dialogs support Escape, focus return and browser Back/Forward. Preserve saves, locale switching, style guide and
      editable prompts; select text for manual copy when clipboard access fails. Base transition: 220ms, disabled with
      reduced motion. Reflow at desktop, 390px and 320px.


      Use AtlasPage.astro, atlas-designs.ts, atlas-runtime.ts and atlas-pages.css. Keep the legacy /style-scenes/
      examples separate; do not embed them into the detail page.


      Compare composition, proportions, typography, artwork and interactions before changing code. Never treat a
      generated image as a functional page or runtime screenshot. Verify Home visibility, dialog history, preserved
      edits, clipboard failure, keyboard, narrow layouts and reduced motion. Capture actual screenshots and outcomes
      with tests/atlas-pages.spec.mjs and report remaining gaps.
style_spec:
  typography:
    zh: 圆体无衬线
    en: Rounded sans
  color:
    zh: '淡紫底 #EDF0FF × 白卡 × 紫 #6C7BFF'
    en: 'Lavender base #EDF0FF, white cards, violet #6C7BFF'
  border:
    zh: 几乎无边框，大圆角 22px
    en: Borderless with 22px+ radius
  shadow:
    zh: 外投影 + inset 内阴影 = 黏土感
    en: Outer + inset shadows create the clay feel
  spacing:
    zh: 蓬松间距，元素相互分离
    en: Puffy spacing, elements float apart
  motion:
    zh: 180–240ms 的柔和弹性按压过渡，尊重 prefers-reduced-motion
    en: 180–240ms soft elastic press transitions; honour prefers-reduced-motion
  states:
    zh: hover 轻微上浮并加深外阴影；focus 用紫色可见柔框；active 转为 inset 内陷；disabled 变扁降饱和；error 用珊瑚红内陷
    en: Hover lifts and deepens the outer shadow; focus shows a visible violet ring; active becomes an inset press; disabled flattens and desaturates; error uses a coral inset

