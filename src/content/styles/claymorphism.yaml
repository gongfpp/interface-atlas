status: published
name:
  zh: 黏土风
  en: Claymorphism
aliases:
  - 黏土风
  - 黏土拟物
  - 软糖质感设计
  - 膨胀立体卡片
  - 3D黏土按钮
  - 橡皮泥风格
  - Clay 3D
  - Puffy UI
category:
  - Style
  - Visual Language
description:
  zh: 把控件捏成软黏土的视觉语言：大圆角、柔和粉彩底色，双重阴影——向内的内 凹阴影加向外的膨胀投影——让元素像充了气的黏土块，圆润 饱满 软乎乎。 它是新拟物与 3D 卡通之间的一种手感化中间态。
  en: 'A visual language that molds controls from soft clay: generous radii on pastel grounds, with a double shadow — an inner concave plus an outer inflated drop — so elements feel like air-puffed clay: round, plump, squishable. A tactile middle ground between neumorphism and 3D cartoon.'
use_when:
  - zh: 儿童 教育 休闲游戏类产品，需要亲和与手感
    en: Kids, education and casual games that want approachable tactility
  - zh: 轻松的社交 消费品牌，传达可爱与松弛感
    en: Relaxed social and consumer brands signaling cuteness and ease
  - zh: 强调触觉反馈的移动端轻交互场景
    en: Mobile touch interactions that want tactile feedback
avoid_when:
  - zh: 专业 金融 企业级场景，软糖感削弱专业信号
    en: Professional, fintech and enterprise contexts — clay reads unserious
  - zh: 信息密集的后台界面，膨胀阴影消耗空间与注意力
    en: Dense dashboards where inflated shadows eat space and focus
  - zh: 深色重度使用场景，粉彩膨胀感不易维持
    en: Heavy dark-mode usage where pastel inflation is hard to sustain
